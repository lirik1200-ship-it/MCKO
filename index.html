/* ---------------- карточки ---------------- */
function deckMeta(id) { return DECKS.filter(function (d) { return d[0] === id; })[0]; }
function ensureOrder() {
  var list = CARDS[S.deck] || [];
  if (S.order.length !== list.length) { S.order = list.map(function (_, i) { return i; }); if (S.shuffled) shuffleOrder(); S.ci = 0; S.flip = false; }
}
function shuffleOrder() { for (var i = S.order.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = S.order[i]; S.order[i] = S.order[j]; S.order[j] = t; } }
function viewCards() {
  ensureOrder();
  var list = CARDS[S.deck] || [], m = deckMeta(S.deck), c = list[S.order[S.ci]] || { front: '', back: '' };
  var out = '<div class="narrow fade"><header class="intro" style="grid-template-columns:1fr"><div><div class="eyebrow">Повторение</div><h1>Карточки</h1>' +
    '<p>Нажмите на карточку или пробел, чтобы увидеть ответ. Стрелки ← → листают колоду.</p></div></header>';
  out += '<div class="decks no-print">' + DECKS.map(function (d) {
    return '<button data-act="deck" data-deck="' + d[0] + '" aria-pressed="' + (d[0] === S.deck) + '">' + d[1] + '<span>' + (CARDS[d[0]] || []).length + '</span></button>';
  }).join('') + '</div>';
  out += '<div class="scene"><div class="flashcard' + (S.flip ? ' flipped' : '') + '" id="flashcard" data-act="flip" role="button" tabindex="0" aria-label="Перевернуть карточку">' +
    '<div class="face' + (c.front.length > 170 ? ' long' : '') + '"><div class="cap">' + m[2] + '</div><p>' + esc(c.front) + '</p><div class="tip">нажмите, чтобы увидеть ответ</div></div>' +
    '<div class="face back' + (c.back.length > 170 ? ' long' : '') + '"><div class="cap">' + m[3] + '</div><p>' + esc(c.back) + '</p><div class="tip">' + m[1] + '</div></div></div></div>';
  out += '<div class="deck-progress"><div class="progress"><i style="width:' + ((S.ci + 1) / Math.max(list.length, 1) * 100) + '%"></i></div></div>';
  out += '<div class="deck-nav no-print"><button class="btn secondary" data-act="prev">' + icon('left') + 'Назад</button>' +
    '<span class="counter">' + (S.ci + 1) + ' / ' + list.length + '</span>' +
    '<button class="btn secondary" data-act="next">Дальше' + icon('right') + '</button>' +
    '<button class="btn ghost" data-act="shuffle">' + icon('shuffle') + (S.shuffled ? 'По порядку' : 'Перемешать') + '</button></div>';
  return out + '</div>';
}

/* ================================================================
   ДЕЙСТВИЯ
   ================================================================ */
function startTest(id, restore) {
  var v = VARIANTS.filter(function (x) { return x.id === id; })[0];
  if (!v) return;
  restore = restore || {};
  S.variant = v;
  S.answers = restore.answers || {};
  S.hintsLeft = restore.hintsLeft != null ? restore.hintsLeft : HINTS_TOTAL;
  S.usedHints = restore.usedHints || {};
  S.timeLeft = restore.timeLeft != null ? restore.timeLeft : TEST_TIME;
  S.blocked = !!restore.blocked;
  S.breakDone = !!restore.breakDone;
  S.inBreak = !!restore.inBreak;
  S.breakLeft = restore.breakLeft != null ? restore.breakLeft : BREAK_LEN;
  S.confirming = false; S.results = null; S.screen = 'test'; S.tab = 'tests';
  render(); saveSession();
  if (!S.blocked) { startTimer(); attachProctor(); }
}
function finishTest() {
  stopTimer(); detachProctor();
  S.inBreak = false;
  S.results = grade(S.variant, S.answers, TEST_TIME - S.timeLeft);
  S.results.hints = HINTS_TOTAL - S.hintsLeft;
  pushHistory(S.results); clearSession();
  S.filter = 'errors'; S.screen = 'results'; render();
}
function goHome() {
  stopTimer(); detachProctor();
  if (S.screen === 'test' && !S.blocked) saveSession();
  S.screen = 'home'; S.confirming = false; render();
}

/* таймер и перерыв */
function startTimer() {
  stopTimer();
  timerId = setInterval(function () {
    if (S.screen !== 'test' || S.blocked || S.tab !== 'tests') return;
    if (S.inBreak) {
      S.breakLeft--;
      var bn = el('break-n'); if (bn) bn.textContent = mmss(S.breakLeft);
      if (S.breakLeft % 5 === 0) saveSession();
      if (S.breakLeft <= 0) endBreak();
      return;
    }
    S.timeLeft--;
    var n = el('time-n');
    if (n) { n.textContent = mmss(S.timeLeft); if (S.timeLeft < 300) n.classList.add('warn'); }
    if (hasBreak(S.variant) && !S.breakDone && S.timeLeft <= BREAK_AT && S.timeLeft > 0) startBreak();
    if (S.timeLeft % 5 === 0) saveSession();
    if (S.timeLeft <= 0) finishTest();
  }, 1000);
}
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function setBreakUI(on) { var r = el('test-root'); if (r) r.classList.toggle('on-break', on); var bn = el('break-n'); if (bn) bn.textContent = mmss(S.breakLeft); }
function startBreak() { S.inBreak = true; S.breakDone = true; S.breakLeft = BREAK_LEN; hideHl(); setBreakUI(true); saveSession(); window.scrollTo(0, 0); }
function endBreak() { S.inBreak = false; setBreakUI(false); saveSession(); }

/* прокторинг */
var proctorOn = false, proctorSince = 0;
function violate() {
  if (!proctorOn || S.screen !== 'test' || S.blocked) return;
  if (Date.now() - proctorSince < 1200) return;
  S.blocked = true; S.inBreak = false;
  stopTimer(); detachProctor(); saveSession(); render();
}
function onVis() { if (document.hidden) violate(); }
function attachProctor() {
  if (proctorOn) return;
  proctorOn = true; proctorSince = Date.now();
  window.addEventListener('blur', violate); document.addEventListener('visibilitychange', onVis);
}
function detachProctor() {
  if (!proctorOn) return;
  proctorOn = false;
  window.removeEventListener('blur', violate); document.removeEventListener('visibilitychange', onVis);
}

/* маркер */
function hideHl() { var b = el('hl-btn'); if (b) b.remove(); hlRange = null; }
function onMouseUp(e) {
  if (S.screen !== 'test' || S.tab !== 'tests' || S.blocked || S.inBreak) return;
  if (e.target.closest && e.target.closest('#hl-btn')) return;
  if (e.target.tagName === 'MARK') { unwrap(e.target); hideHl(); return; }
  var sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.toString().trim()) { hideHl(); return; }
  var range = sel.getRangeAt(0), node = range.commonAncestorContainer;
  var host = (node.nodeType === 1 ? node : node.parentNode).closest('.passage-text');
  if (!host) { hideHl(); return; }
  var r = range.getBoundingClientRect();
  hideHl(); hlRange = range.cloneRange();
  var btn = document.createElement('button');
  btn.id = 'hl-btn'; btn.type = 'button'; btn.innerHTML = icon('pen') + 'Выделить';
  btn.style.left = (r.left + r.width / 2 + window.scrollX) + 'px';
  btn.style.top = (r.top + window.scrollY - 8) + 'px';
  btn.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
  btn.addEventListener('click', applyHl);
  document.body.appendChild(btn);
}
function applyHl() {
  if (!hlRange) return;
  try { var m = document.createElement('mark'); m.title = 'Нажмите, чтобы снять выделение'; hlRange.surroundContents(m); }
  catch (err) { try { var f = hlRange.extractContents(), m2 = document.createElement('mark'); m2.appendChild(f); hlRange.insertNode(m2); } catch (e2) {} }
  window.getSelection().removeAllRanges(); hideHl();
}
function unwrap(mark) { var p = mark.parentNode; while (mark.firstChild) p.insertBefore(mark.firstChild, mark); p.removeChild(mark); p.normalize(); }

/* ответы */
function setAnswer(q, val) { S.answers[q] = val; saveSession(); refreshNav(q); }
function seqFromDom(qid) {
  var list = document.querySelector('[data-seq="' + qid + '"]'); if (!list) return;
  var v = Array.prototype.map.call(list.children, function (li) { return li.dataset.n; }).join('');
  var inp = document.querySelector('[data-a="seq"][data-q="' + qid + '"]'); if (inp) inp.value = v;
  setAnswer(qid, v);
}
function seqToDom(qid, s) {
  var list = document.querySelector('[data-seq="' + qid + '"]'); if (!list) return;
  s.split('').forEach(function (n) { var li = list.querySelector('[data-n="' + n + '"]'); if (li) list.appendChild(li); });
}
function onInput(e) {
  var t = e.target, a = t.dataset && t.dataset.a;
  if (!a) return;
  var q = t.dataset.q;
  if (a === 'st') setAnswer(q, t.value);
  else if (a === 'fb') { var arr = Array.isArray(S.answers[q]) ? S.answers[q].slice() : []; arr[+t.dataset.i] = t.value; setAnswer(q, arr); }
  else if (a === 'seq') {
    t.value = t.value.replace(/\D/g, '');
    var qq = qById(q);
    if (qq && validPerm(t.value, qq.items.length)) seqToDom(q, t.value);
    setAnswer(q, t.value);
  }
  else if (a === 'sc') setAnswer(q, t.value);
  else if (a === 'mc') { var o = Object.assign({}, S.answers[q] || {}); o[t.dataset.opt] = t.checked; setAnswer(q, o); }
  else if (a === 'mt') { var m = Object.assign({}, S.answers[q] || {}); m[t.dataset.left] = t.value; setAnswer(q, m); }
}

/* перетаскивание в последовательности */
function onDragStart(e) { var li = e.target.closest && e.target.closest('.seq-item'); if (!li) return; dragEl = li; li.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', li.dataset.n); } catch (x) {} }
function onDragOver(e) {
  if (!dragEl) return;
  var li = e.target.closest && e.target.closest('.seq-item');
  if (!li || li === dragEl || li.parentNode !== dragEl.parentNode) return;
  e.preventDefault();
  var r = li.getBoundingClientRect();
  li.parentNode.insertBefore(dragEl, e.clientY < r.top + r.height / 2 ? li : li.nextSibling);
}
function onDragEnd() { if (!dragEl) return; var qid = dragEl.parentNode.dataset.seq; dragEl.classList.remove('dragging'); dragEl = null; seqFromDom(qid); }

/* клики */
function onClick(e) {
  var tf = e.target.closest('[data-a="tf"]');
  if (tf) {
    var q = tf.dataset.q, o = Object.assign({}, S.answers[q] || {});
    o[tf.dataset.item] = tf.dataset.val; setAnswer(q, o);
    tf.parentNode.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b === tf)); });
    return;
  }
  var node = e.target.closest('[data-act]');
  if (!node) return;
  var act = node.dataset.act;
  if (act === 'tab') {
    S.tab = node.dataset.tab;
    if (S.tab === 'cards') { stopTimer(); detachProctor(); }
    else if (S.screen === 'test' && !S.blocked) { startTimer(); attachProctor(); }
    render();
  }
  else if (act === 'theme') toggleTheme();
  else if (act === 'start' || act === 'retry') startTest(node.dataset.id);
  else if (act === 'resume') { var s = getSession(); if (s) startTest(s.v.id, s.s); }
  else if (act === 'discard') { clearSession(); render(); }
  else if (act === 'clear-history') { store.del(K_HISTORY); render(); }
  else if (act === 'home') goHome();
  else if (act === 'ask-finish') { S.confirming = true; var z = el('finish-zone'); z.innerHTML = finishZone(); z.scrollIntoView({ block: 'center' }); }
  else if (act === 'cancel-finish') { S.confirming = false; el('finish-zone').innerHTML = finishZone(); }
  else if (act === 'finish') finishTest();
  else if (act === 'end-break') endBreak();
  else if (act === 'goto') { var t = el('q-' + node.dataset.id); if (t) t.scrollIntoView({ block: 'start' }); el('side').classList.remove('open'); }
  else if (act === 'toggle-map') el('side').classList.toggle('open');
  else if (act === 'goto-rev') {
    var id = node.dataset.id;
    if (!el('rev-' + id)) { S.filter = 'all'; render(); }
    var rv = el('rev-' + id); if (rv) rv.scrollIntoView({ block: 'start' });
  }
  else if (act === 'filter') { S.filter = node.dataset.f; render(); }
  else if (act === 'print') window.print();
  else if (act === 'hint') useHint(node.dataset.id);
  else if (act === 'seq-move') {
    var list = document.querySelector('[data-seq="' + node.dataset.q + '"]'), li = list && list.querySelector('[data-n="' + node.dataset.n + '"]');
    if (!li) return;
    if (+node.dataset.dir < 0 && li.previousElementSibling) list.insertBefore(li, li.previousElementSibling);
    else if (+node.dataset.dir > 0 && li.nextElementSibling) list.insertBefore(li.nextElementSibling, li);
    seqFromDom(node.dataset.q);
  }
  else if (act === 'deck') { S.deck = node.dataset.deck; S.order = []; S.ci = 0; S.flip = false; render(); }
  else if (act === 'flip') { S.flip = !S.flip; el('flashcard').classList.toggle('flipped', S.flip); }
  else if (act === 'next') stepCard(1);
  else if (act === 'prev') stepCard(-1);
  else if (act === 'shuffle') { S.shuffled = !S.shuffled; if (S.shuffled) shuffleOrder(); else S.order.sort(function (a, b) { return a - b; }); S.ci = 0; S.flip = false; render(); }
}
function useHint(qid) {
  if (S.hintsLeft <= 0 || S.usedHints[qid]) return;
  var q = qById(qid); if (!q) return;
  S.hintsLeft--; S.usedHints[qid] = getHint(q); saveSession();
  var n = el('hints-n'); if (n) n.textContent = S.hintsLeft;
  var art = el('q-' + qid);
  if (art) { var f = art.querySelector('.q-foot'); var box = document.createElement('div'); box.innerHTML = hintBox(S.usedHints[qid]); if (f) f.replaceWith(box.firstChild); }
  if (S.hintsLeft === 0) document.querySelectorAll('.q-foot').forEach(function (b) { b.remove(); });
}
function stepCard(d) { var list = CARDS[S.deck] || []; if (!list.length) return; S.ci = (S.ci + d + list.length) % list.length; S.flip = false; render(); }

/* тема */
function curTheme() { return document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function toggleTheme() { var t = curTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); store.set(K_THEME, t); syncThemeBtn(); }
function syncThemeBtn() { var b = el('theme-btn'); if (!b) return; var d = curTheme() === 'dark'; b.innerHTML = icon(d ? 'sun' : 'moon'); b.setAttribute('aria-label', d ? 'Светлая тема' : 'Тёмная тема'); }

/* ================================================================
   ЗАПУСК
   ================================================================ */
function init() {
  app = el('app');
  var saved = store.get(K_THEME, null);
  if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  el('topbar').innerHTML = '<div class="brand"><span class="brand-mark">' + icon('feather') + '</span><span class="brand-name">МЦКО · Литература<small>10 класс</small></span></div>' +
    '<div class="seg" role="tablist"><button class="seg-btn" role="tab" data-act="tab" data-tab="tests" aria-selected="true">' + icon('book') + '<span class="lbl">Варианты</span></button>' +
    '<button class="seg-btn" role="tab" data-act="tab" data-tab="cards" aria-selected="false">' + icon('cards') + '<span class="lbl">Карточки</span></button></div>' +
    '<button class="icon-btn" id="theme-btn" data-act="theme"></button>';
  syncThemeBtn();
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onInput);
  document.addEventListener('mouseup', onMouseUp);
  document.addEventListener('dragstart', onDragStart);
  document.addEventListener('dragover', onDragOver);
  document.addEventListener('dragend', onDragEnd);
  document.addEventListener('keydown', function (e) {
    if (S.tab !== 'cards') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); stepCard(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stepCard(-1); }
    else if (e.key === ' ' || e.key === 'Enter') {
      var ae = document.activeElement;
      if (ae && ae.tagName === 'BUTTON' && ae.id !== 'flashcard') return;
      e.preventDefault(); S.flip = !S.flip; var f = el('flashcard'); if (f) f.classList.toggle('flipped', S.flip);
    }
  });
  window.addEventListener('beforeprint', function () { document.querySelectorAll('details.expl').forEach(function (d) { d.open = true; }); });
  window.addEventListener('beforeunload', function () { if (S.screen === 'test') saveSession(); });
  render();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
