<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Литературный бланк МЦКО</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --surface-3:#e8ebf0;
  --ink:#171a21; --ink-2:#4a5160; --ink-3:#7a8291;
  --line:#e2e5ea; --line-2:#cdd2da;
  --accent:#2d55a6; --accent-soft:#e9eef9; --accent-ink:#ffffff;
  --amber:#9a6410; --amber-soft:#fbf1df;
  --ok:#1e7f52; --ok-soft:#e5f3eb;
  --bad:#bd3a32; --bad-soft:#fbeae8;
  --mark:#fde68a; --mark-ink:#231d10;
  --shadow-1:0 1px 2px rgba(20,24,33,.05);
  --shadow-2:0 10px 30px -14px rgba(20,24,33,.22),0 2px 6px rgba(20,24,33,.05);
  --r:12px; --r-s:8px;
  --ui:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --text:"Literata",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --top:60px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#171a20; --surface-2:#1d2128; --surface-3:#262b34;
    --ink:#e8eaee; --ink-2:#aeb4bf; --ink-3:#808794;
    --line:#272c35; --line-2:#363c47;
    --accent:#8fb0f0; --accent-soft:#1b2640; --accent-ink:#0f1115;
    --amber:#e2a74c; --amber-soft:#2a2113;
    --ok:#6ccb98; --ok-soft:#14251c;
    --bad:#f08a80; --bad-soft:#2c1715;
    --mark:#b8952f; --mark-ink:#16120a;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 12px 32px -14px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a20; --surface-2:#1d2128; --surface-3:#262b34;
  --ink:#e8eaee; --ink-2:#aeb4bf; --ink-3:#808794;
  --line:#272c35; --line-2:#363c47;
  --accent:#8fb0f0; --accent-soft:#1b2640; --accent-ink:#0f1115;
  --amber:#e2a74c; --amber-soft:#2a2113;
  --ok:#6ccb98; --ok-soft:#14251c;
  --bad:#f08a80; --bad-soft:#2c1715;
  --mark:#b8952f; --mark-ink:#16120a;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 12px 32px -14px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.35);
  color-scheme:dark;
}

/* ---------- база ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--ui);font-weight:600;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}

/* ---------- верхняя панель ---------- */
.topbar{position:sticky;top:0;z-index:60;height:var(--top);display:flex;align-items:center;gap:16px;
  padding:0 clamp(12px,3vw,28px);background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink)}
.brand-mark .icon{width:17px;height:17px}
.brand-name{font-weight:600;font-size:15px;white-space:nowrap}
.brand-name small{display:block;font-weight:500;font-size:12px;color:var(--ink-3)}
.seg{display:flex;padding:3px;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.seg-btn{display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:7px;font-size:14px;font-weight:500;color:var(--ink-2);transition:background .15s,color .15s}
.seg-btn:hover{color:var(--ink)}
.seg-btn[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;color:var(--ink-2);border:1px solid var(--line)}
.icon-btn:hover{color:var(--ink);background:var(--surface-2)}
@media (max-width:560px){.brand-name small{display:none}.seg-btn .lbl{display:none}.seg-btn{padding:6px 10px}.brand-name{font-size:14px}}

main{padding:clamp(16px,3vw,32px) clamp(12px,3vw,28px) 64px}
.wrap{max-width:1100px;margin:0 auto}
.narrow{max-width:820px;margin:0 auto}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:9px;
  font-size:14.5px;font-weight:600;background:var(--accent);color:var(--accent-ink);transition:filter .15s,background .15s,transform .05s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.btn.secondary:hover{background:var(--surface-2);filter:none}
.btn.ghost{background:transparent;color:var(--ink-2);height:36px;padding:0 10px}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink);filter:none}
.btn.block{width:100%;height:46px;font-size:15.5px}
.btn.danger{background:var(--bad);color:#fff}

/* ---------- общее: карточки, разделы, чипы ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1)}
.sec{margin-top:40px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-head h2{font-size:19px}
.sec-head .note{font-size:13.5px;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip .icon{width:14px;height:14px}

/* ---------- главная ---------- */
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding:8px 0 8px}
.intro .eyebrow{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:8px}
.intro h1{font-size:clamp(26px,4vw,34px)}
.intro p{margin-top:8px;color:var(--ink-2);max-width:56ch}
.stats{display:flex;gap:10px}
.stat{min-width:104px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stat b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-3)}
@media (max-width:760px){.intro{grid-template-columns:1fr}.stats{flex-wrap:wrap}.stat{flex:1}}

.resume{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:24px;padding:14px 16px;background:var(--amber-soft);
  border:1px solid var(--line);border-radius:var(--r)}
.resume .icon{color:var(--amber)}
.resume p{flex:1;min-width:220px;font-size:14.5px}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.vcard{display:flex;flex-direction:column;gap:10px;text-align:left;padding:18px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow-1);transition:border-color .15s,box-shadow .15s,transform .15s}
.vcard:hover{border-color:var(--line-2);box-shadow:var(--shadow-2);transform:translateY(-1px)}
.vcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vcard-top .icon{color:var(--ink-3);transition:transform .15s,color .15s}
.vcard:hover .vcard-top .icon{color:var(--accent);transform:translateX(2px)}
.vcard h3{font-size:17px}
.vcard .works{font-size:14px;color:var(--ink-2);line-height:1.45}
.vcard-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.best{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink-2)}
.bar{position:relative;width:64px;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}

.notice{display:flex;gap:12px;padding:14px 16px;background:var(--surface-2);border-radius:var(--r);font-size:14px;color:var(--ink-2);line-height:1.5}
.notice .icon{color:var(--ink-3);margin-top:2px}
.notice b{color:var(--ink)}

.table-wrap{overflow-x:auto}
table.hist{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.hist th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);padding:12px 16px;border-bottom:1px solid var(--line)}
.hist td{padding:12px 16px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.hist tr:last-child td{border-bottom:0}
.hist .pct{font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:14.5px}

/* ---------- экран работы ---------- */
.test{display:grid;grid-template-columns:minmax(0,1fr) 284px;gap:24px;max-width:1180px;margin:0 auto;align-items:start}
.test-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px}
.test-head h1{font-size:19px}
.test-head .works{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.content{display:flex;flex-direction:column;gap:16px;min-width:0}
.part-label{display:flex;align-items:center;gap:10px;margin:16px 2px 0;font-size:13px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.part-label::after{content:"";flex:1;height:1px;background:var(--line)}
.passage{padding:clamp(18px,3vw,28px)}
.passage h2{font-size:16px;margin-bottom:14px}
.passage-text{font-family:var(--text);font-size:17px;line-height:1.78;white-space:pre-wrap;max-width:68ch}
.passage-text.verse{font-style:italic}
.passage-hint{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:12.5px;color:var(--ink-3)}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px;cursor:pointer}
#hl-btn{position:absolute;z-index:80;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;
  background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;box-shadow:var(--shadow-2);transform:translate(-50%,-100%)}
#hl-btn .icon{width:15px;height:15px}

.q{padding:clamp(16px,2.6vw,24px);scroll-margin-top:calc(var(--top) + 16px)}
.q-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.q-num{display:grid;place-items:center;flex:none;min-width:34px;height:34px;padding:0 6px;border-radius:9px;background:var(--surface-2);
  font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.q.done .q-num{background:var(--accent-soft);color:var(--accent)}
.q-title{flex:1;font-size:16px;line-height:1.5;padding-top:5px}
.q-title strong{font-weight:600}
.q-head .chip{margin-top:5px}
.q-foot{display:flex;align-items:center;gap:10px;margin-top:14px}
.hint-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2);border:1px solid var(--line)}
.hint-btn:hover{color:var(--accent);border-color:var(--accent)}
.hint{display:flex;gap:10px;margin-top:14px;padding:12px 14px;background:var(--accent-soft);border-radius:var(--r-s);font-size:14.5px;line-height:1.5}
.hint .icon{color:var(--accent);margin-top:2px}
.hint b{display:block;font-size:12.5px;color:var(--accent);margin-bottom:2px}

/* поля и варианты */
.field{width:100%;height:44px;padding:0 14px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-s);
  color:var(--accent);font-weight:600;transition:border-color .15s,box-shadow .15s}
.field::placeholder{color:var(--ink-3);font-weight:400}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.field{cursor:pointer;font-weight:500;color:var(--ink);padding-right:8px}
.cloze{font-family:var(--text);font-size:16.5px;line-height:2.5;padding:14px 18px;background:var(--surface-2);border-radius:var(--r-s)}
.blank{display:inline-block;width:9.5em;max-width:58%;height:34px;margin:0 4px;padding:0 10px;vertical-align:middle;background:var(--surface);
  border:1px solid var(--line-2);border-radius:7px;font-family:var(--ui);font-size:15px;font-weight:600;color:var(--accent);text-align:center}
.blank:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-s);cursor:pointer;
  font-size:15.5px;line-height:1.5;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--line-2);background:var(--surface-2)}
.opt input{flex:none;width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.tf{display:flex;flex-direction:column;gap:8px}
.tf-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-s)}
.tf-row span{flex:1;min-width:220px;font-size:15.5px;line-height:1.5}
.toggle{display:flex;padding:3px;gap:2px;background:var(--surface-2);border-radius:9px}
.toggle button{height:32px;padding:0 14px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.match{display:flex;flex-direction:column;gap:8px}
.match-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px;align-items:center}
.match-row .left{font-size:15.5px;line-height:1.45;padding:10px 0}
@media (max-width:640px){.match-row{grid-template-columns:1fr}.match-row .left{padding:6px 0 0}}
.ref{margin-top:12px;padding:12px 16px;background:var(--surface-2);border-radius:var(--r-s)}
.ref h4{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-bottom:8px}
.ref ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.ref li{font-size:14.5px;line-height:1.45}

/* последовательность */
.seq-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.seq-item{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-s);
  font-size:15.5px;line-height:1.45;cursor:grab;user-select:none;transition:box-shadow .15s,border-color .15s}
.seq-item:hover{border-color:var(--accent)}
.seq-item.dragging{opacity:.55;box-shadow:var(--shadow-2)}
.seq-item .grip{color:var(--ink-3)}
.seq-item .n{display:grid;place-items:center;flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface-2);font-weight:600;font-size:13px}
.seq-item .t{flex:1;min-width:0}
.seq-move{display:flex;gap:2px}
.seq-move button{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;color:var(--ink-2)}
.seq-move button:hover{background:var(--surface-2);color:var(--accent)}
.seq-move .icon{width:16px;height:16px}
.seq-answer{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:12px}
.seq-answer .field{width:120px;text-align:center;letter-spacing:.3em;font-family:var(--mono)}
.seq-answer span{font-size:13px;color:var(--ink-3)}

/* боковая панель */
.side{position:sticky;top:calc(var(--top) + 16px);display:flex;flex-direction:column;gap:12px}
.side-card{padding:16px}
.timer-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.timer{font-family:var(--mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer.warn{color:var(--bad)}
.timer-cap{font-size:12.5px;color:var(--ink-3)}
.progress{height:6px;margin-top:12px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .25s}
.side-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--ink-2)}
.qmap{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.qmap button{height:34px;border-radius:8px;border:1px solid var(--line-2);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2);background:var(--surface)}
.qmap button:hover{border-color:var(--accent);color:var(--accent)}
.qmap button.done{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.side h3{font-size:13px;font-weight:600;color:var(--ink-3)}
.side-note{display:flex;gap:8px;font-size:12.5px;color:var(--ink-3);line-height:1.45}
.side-note .icon{width:15px;height:15px;margin-top:1px}
.map-toggle{display:none}
@media (max-width:980px){
  .test{grid-template-columns:1fr}
  .side{order:-1;top:var(--top);z-index:40;gap:0;margin:0 calc(-1 * clamp(12px,3vw,28px))}
  .side-card{border-radius:0;border-width:0 0 1px;box-shadow:none;padding:10px clamp(12px,3vw,28px)}
  .side-card.extra{display:none}
  .timer{font-size:22px}
  .progress{margin-top:8px}
  .side-meta{margin-top:6px}
  .map-toggle{display:inline-flex}
  .qmap{display:none;grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}
  .side.open .qmap{display:grid}
}

/* финиш */
.finish{padding:20px}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.confirm p{flex:1;min-width:220px;font-size:15px}

/* перерыв */
.break{display:none;padding:clamp(28px,6vw,56px) 24px;text-align:center}
.on-break .break{display:block}
.on-break .content > :not(.break){display:none}
.break .icon{width:36px;height:36px;color:var(--accent)}
.break h2{font-size:22px;margin:12px 0 6px}
.break p{color:var(--ink-2);max-width:44ch;margin:0 auto}
.break .timer{font-size:48px;margin:20px 0}

/* блокировка */
.blocked{max-width:520px;margin:48px auto;padding:36px 28px;text-align:center}
.blocked .icon{width:40px;height:40px;color:var(--bad)}
.blocked h1{font-size:24px;margin:14px 0 8px}
.blocked p{color:var(--ink-2);margin-bottom:22px}

/* ---------- результаты ---------- */
.res-top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.res-top{grid-template-columns:1fr}}
.score{padding:24px}
.score .faint{font-size:13.5px}
.score-num{display:flex;align-items:baseline;gap:8px;margin:8px 0 6px}
.score-num b{font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.score-num span{font-size:22px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.score-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.tally div{padding:10px 12px;border-radius:var(--r-s);background:var(--surface-2)}
.tally b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.tally span{font-size:12.5px;color:var(--ink-2)}
.tally .t-ok b{color:var(--ok)}.tally .t-part b{color:var(--amber)}.tally .t-zero b{color:var(--bad)}
.skills{padding:24px}
.skills h2,.rmap h2{font-size:16px;margin-bottom:14px}
.skill{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:12px;align-items:center;padding:8px 0}
.skill + .skill{border-top:1px solid var(--line)}
.skill .name{font-size:14.5px}
.skill .name small{display:block;font-size:12px;color:var(--ink-3)}
.skill .bar{width:100%;height:8px}
.skill .val{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.rmap{margin-top:16px;padding:20px 24px}
.rmap-grid{display:flex;flex-wrap:wrap;gap:6px}
.rmap-grid button{min-width:44px;height:34px;padding:0 8px;border-radius:8px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.rmap-grid .full{background:var(--ok-soft);color:var(--ok)}
.rmap-grid .part{background:var(--amber-soft);color:var(--amber)}
.rmap-grid .zero{background:var(--bad-soft);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12.5px;color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.review-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:32px 0 12px}
.review-bar h2{font-size:19px}
.review-bar .tools{display:flex;gap:8px;align-items:center}
.review{display:flex;flex-direction:column;gap:10px}
.rev{padding:18px 20px;scroll-margin-top:calc(var(--top) + 16px)}
.rev-head{display:flex;gap:12px;align-items:flex-start}
.rev-head .q-num{min-width:40px}
.rev-head .t{flex:1;font-size:15px;line-height:1.5;padding-top:6px}
.rev-head .chip{margin-top:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.cmp.single{grid-template-columns:1fr}
@media (max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp div{padding:10px 12px;border-radius:var(--r-s);font-size:14.5px;line-height:1.5;white-space:pre-wrap}
.cmp .lbl{display:block;font-size:12px;font-weight:600;margin-bottom:3px;white-space:normal}
.cmp .mine{background:var(--bad-soft)}.cmp .mine .lbl{color:var(--bad)}
.cmp .mine.ok{background:var(--ok-soft)}.cmp .mine.ok .lbl{color:var(--ok)}
.cmp .mine.part{background:var(--amber-soft)}.cmp .mine.part .lbl{color:var(--amber)}
.cmp .right{background:var(--surface-2)}.cmp .right .lbl{color:var(--ok)}
details.expl{margin-top:10px}
details.expl summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-2);list-style:none}
details.expl summary::-webkit-details-marker{display:none}
details.expl summary:hover{color:var(--accent)}
details.expl summary .icon{width:15px;height:15px;transition:transform .2s}
details.expl[open] summary .icon{transform:rotate(180deg)}
.expl-body{margin-top:8px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 var(--r-s) var(--r-s) 0;
  font-family:var(--text);font-size:15.5px;line-height:1.65;white-space:pre-wrap}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}

/* ---------- карточки ---------- */
.decks{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0 24px}
.decks button{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink-2)}
.decks button:hover{border-color:var(--line-2);color:var(--ink)}
.decks button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.decks button span{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.scene{perspective:1600px;max-width:640px;margin:0 auto}
.flashcard{position:relative;min-height:340px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1);cursor:pointer}
.flashcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;overflow:auto;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:48px clamp(20px,5vw,44px);text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-2)}
.face .cap{position:absolute;top:18px;left:0;right:0;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.face p{font-family:var(--text);font-size:clamp(17px,2.4vw,20px);line-height:1.6;white-space:pre-wrap;max-width:32em}
.face.long p{font-size:clamp(15.5px,2vw,17px)}
.face .tip{position:absolute;bottom:16px;left:0;right:0;font-size:12.5px;color:var(--ink-3)}
.face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:transparent}
.face.back .cap,.face.back .tip{color:var(--accent)}
.deck-nav{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:22px}
.deck-nav .counter{min-width:72px;text-align:center;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.deck-progress{max-width:640px;margin:14px auto 0}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff;color:#000}
  .topbar,.no-print,#hl-btn{display:none!important}
  main{padding:0}
  .panel{box-shadow:none;border-color:#ccc}
  .res-top{grid-template-columns:1fr 1fr}
  details.expl summary{display:none}
  details.expl > .expl-body{display:block}
  .rev{break-inside:avoid}
}
</style>

войств одного предмета на другой на основании их сходства.","back":"Метафора"},{"front":"Замена одного слова другим на основе смежности двух понятий («читал охотно Апулея, а Цицерона не читал»).","back":"Метонимия"},{"front":"Наделение неодушевленных предметов человеческими чувствами и свойствами.","back":"Олицетворение"},{"front":"Прямое сопоставление явлений на основе их сходства (часто с союзами «как», «словно»).","back":"Сравнение"},{"front":"Образное, художественное определение, подчеркивающее характерное свойство предмета.","back":"Эпитет"},{"front":"Стилистическая фигура: резкое противопоставление понятий, образов или состояний.","back":"Антитеза"},{"front":"Расположение слов по возрастанию или убыванию их эмоциональной значимости.","back":"Градация"},{"front":"Нарушение прямого порядка слов в предложении для выделения смысловых акцентов.","back":"Инверсия"},{"front":"Намеренное расчленение предложения на самостоятельные отрезки с точками («Он ушел. Навсегда.»).","back":"Парцелляция"},{"front":"Вопрос, задающийся не для получения ответа, а для сильного эмоционального утверждения мысли.","back":"Риторический вопрос"},{"front":"Эмоциональное утверждение, облеченное в восклицательную форму, не требующее ответа.","back":"Риторическое восклицание"},{"front":"Условное обращение к неодушевленным предметам, явлениям природы или отсутствующим людям.","back":"Риторическое обращение"},{"front":"Единоначатие; повторение одинаковых слов или фраз в начале строк.","back":"Анафора"},{"front":"Повторение одинаковых слов или фраз в конце стихотворных строк.","back":"Эпифора"},{"front":"Повторение одинаковых согласных звуков в стихотворении для звуковой выразительности.","back":"Аллитерация"},{"front":"Повторение одинаковых гласных звуков в стихотворной строке.","back":"Ассонанс"},{"front":"Намеренное повторение одного и того же слова или словосочетания для усиления выразительности.","back":"Лексический повтор"},{"front":"Одинаковое синтаксическое построение соседних предложений или стихотворных строк.","back":"Синтаксический параллелизм"},{"front":"Слова, противоположные по своему лексическому значению.","back":"Антонимы"},{"front":"Слова, близкие или тождественные по смыслу, но разные по звучанию.","back":"Синонимы"},{"front":"Слова, вышедшие из активного употребления в связи с исчезновением обозначаемых ими предметов и явлений.","back":"Историзмы"},{"front":"Новые слова, созданные автором или появившиеся в языке недавно.","back":"Неологизм"},{"front":"Краткое, выразительное изречение, содержащее обобщенную глубокую мысль.","back":"Афоризм"},{"front":"Устойчивое, неделимое словосочетание, смысл которого не складывается из смыслов отдельных слов («бить баклуши»).","back":"Фразеологизм"}],"characters":[{"front":"Властная купчиха, требующая неукоснительного соблюдения старых патриархальных порядков, свекровь Катерины.","back":"Марфа Игнатьевна Кабанова\n(Кабаниха)\n«Гроза» (А.Н. Островский)"},{"front":"Слабовольный купец, полностью подчиняющийся воле матери, любящий жену, но не способный ее защитить.","back":"Тихон Кабанов\n«Гроза» (А.Н. Островский)"},{"front":"Механик-самоучка, мечтающий изобрести перпетуум-мобиле и установить громоотводы; осуждает «жестокие нравы».","back":"Кулигин\n«Гроза» (А.Н. Островский)"},{"front":"Странница, рассказывающая небылицы про людей с песьими головами и про то, что «время стало короче».","back":"Феклуша\n«Гроза» (А.Н. Островский)"},{"front":"Дерзкий конторщик Дикого, единственный, кто не боится отвечать ему грубостью; сбегает с Варварой в Москву.","back":"Иван Кудряш\n«Гроза» (А.Н. Островский)"},{"front":"Мещанин, обсуждающий с Кулигиным самодурство Дикого в начале пьесы.","back":"Шапкин\n«Гроза» (А.Н. Островский)"},{"front":"Старая барыня, которая в сопровождении двух лакеев пугает главную героиню геенной огненной за её «красоту».","back":"Полусумасшедшая барыня\n«Гроза» (А.Н. Островский)"},{"front":"Разорившаяся помещица, чувствительная, добрая, но легкомысленная и непрактичная.","back":"Любовь Андреевна Раневская\n«Вишневый сад» (А.П. Чехов)"},{"front":"Предприимчивый купец, сын бывшего крепостного, покупающий дворянское имение.","back":"Ермолай Алексеевич Лопахин\n«Вишневый сад» (А.П. Чехов)"},{"front":"Брат Раневской, инфантильный аристократ, произносящий речи перед старым шкафом.","back":"Леонид Андреевич Гаев\n«Вишневый сад» (А.П. Чехов)"},{"front":"«Вечный студент», идеалист, призывающий Аню к новой жизни и труду.","back":"Петя Трофимов\n«Вишневый сад» (А.П. Чехов)"},{"front":"Старый, больной лакей, которого в финале забывают в заколоченном доме.","back":"Фирс\n«Вишневый сад» (А.П. Чехов)"},{"front":"Земский врач, который постепенно деградирует, полнеет и превращается в раздражительного стяжателя.","back":"Дмитрий Ионыч Старцев\nРассказ «Ионыч» (А.П. Чехов)"},{"front":"Учитель гимназии, панически боявшийся любых отклонений от правил, прятавший себя в чехлы.","back":"Беликов\nРассказ «Человек в футляре» (А.П. Чехов)"},{"front":"Мелкий чиновник (экзекутор), нечаянно чихнувший на генерала и умерший от страха.","back":"Иван Дмитриевич Червяков\nРассказ «Смерть чиновника» (А.П. Чехов)"},{"front":"Аристократ, англоман с безупречными манерами, вступающий в яростный идеологический спор с нигилистом.","back":"Павел Петрович Кирсанов\n«Отцы и дети» (И.С. Тургенев)"},{"front":"«Псевдонигилист», подражатель Базарова, который лишь поверхностно перенял модные фразы.","back":"Виктор Ситников\n«Отцы и дети» (И.С. Тургенев)"},{"front":"Эмансипированная дама, передовая женщина, подражающая нигилистам, но выглядящая карикатурно.","back":"Евдоксия Кукшина\n«Отцы и дети» (И.С. Тургенев)"},{"front":"Слуга в доме Кирсановых, щеголяющий цветными галстуками и читающий по слогам, представитель «новых» слуг.","back":"Петр\n«Отцы и дети» (И.С. Тургенев)"},{"front":"Молодая, простая крестьянка, ставшая матерью ребенка Николая Петровича Кирсанова.","back":"Фенечка\n«Отцы и дети» (И.С. Тургенев)"},{"front":"Бывший студент, друг Раскольникова, добрый и отзывчивый, который бескорыстно помогает его семье.","back":"Дмитрий Разумихин\n«Преступление и наказание» (Ф.М. Достоевский)"},{"front":"Умный и проницательный следователь по уголовным делам, тонкий психолог, разгадавший тайну Раскольникова.","back":"Порфирий Петрович\n«Преступление и наказание» (Ф.М. Достоевский)"},{"front":"Беспринципный делец, мечтающий жениться на бедной девушке, чтобы она всю жизнь считала его своим спасителем.","back":"Петр Петрович Лужин\n«Преступление и наказание» (Ф.М. Достоевский)"},{"front":"Молодой чиновник, пошлый приверженец модных «прогрессивных» (коммунистических) идей, сосед Мармеладовых.","back":"Андрей Лебезятников\n«Преступление и наказание» (Ф.М. Достоевский)"},{"front":"Дворянин, утративший интерес к активной жизни; человек с «хрустальной» душой, проводящий дни на диване.","back":"Илья Ильич Обломов\n«Обломов» (И.А. Гончаров)"},{"front":"Энергичный, деятельный и прагматичный друг главного героя, наполовину немец.","back":"Андрей Штольц\n«Обломов» (И.А. Гончаров)"},{"front":"Верный, но ворчливый и неряшливый слуга, преданный своему барину со времен его детства в Обломовке.","back":"Захар\n«Обломов» (И.А. Гончаров)"},{"front":"Брат Агафьи Матвеевны Пшеницыной, хитрый и беспринципный чиновник, провернувший аферу с фальшивым долгом.","back":"Иван Матвеевич Мухояров\n«Обломов» (И.А. Гончаров)"},{"front":"Простой солдат, воплощающий в себе народную мудрость, доброту и способность жить настоящим моментом.","back":"Платон Каратаев\n«Война и мир» (Л.Н. Толстой)"},{"front":"Скромный, внешне негероический командир артиллерийской батареи, совершивший подвиг в Шенграбенском сражении.","back":"Капитан Тушин\n«Война и мир» (Л.Н. Толстой)"},{"front":"Гусар, командир партизанского отряда, смелый и лихой офицер; сделал предложение Наташе Ростовой.","back":"Василий Денисов\n«Война и мир» (Л.Н. Толстой)"},{"front":"Крестьянин-партизан, жестокий и беспощадный к врагу, представляющий собой «дубину народной войны».","back":"Тихон Щербатый\n«Война и мир» (Л.Н. Толстой)"},{"front":"Старый, властный и жесткий князь, требующий от дочери абсолютного повиновения.","back":"Николай Андреевич Болконский\n«Война и мир» (Л.Н. Толстой)"},{"front":"Немецкий офицер на русской службе, педантичный мещанин, муж Веры Ростовой.","back":"Берг\n«Война и мир» (Л.Н. Толстой)"}],"plot":[{"front":"Героиня тайно встречается с возлюбленным в овраге за садом, пока ее муж находится в отъезде по торговым делам.","back":"Свидание Катерины и Бориса\n«Гроза» (А.Н. Островский)"},{"front":"Не выдержав мук совести и угрожающих раскатов грома, героиня падает на колени и прилюдно признается мужу в измене.","back":"Покаяние Катерины\n«Гроза» (А.Н. Островский)"},{"front":"На торгах бывший крепостной заявляет: «Я купил!», приобретая дворянское имение, где его отец и дед были рабами.","back":"Покупка вишневого сада Лопахиным\n«Вишневый сад» (А.П. Чехов)"},{"front":"Под стук топоров, рубящих деревья, старого больного слугу забывают в наглухо запертом доме.","back":"Финал пьесы\n«Вишневый сад» (А.П. Чехов)"},{"front":"Герой вступает в яростный спор о науке, искусстве и народе со старшим поколением за обеденным столом.","back":"Спор Базарова и Павла Петровича\n«Отцы и дети» (И.С. Тургенев)"},{"front":"Герой случайно режет палец при вскрытии тифозного крестьянина, заражается и трагически умирает.","back":"Смерть Базарова\n«Отцы и дети» (И.С. Тургенев)"},{"front":"Нищий бывший чиновник погибает под колесами щегольской коляски, успевая лишь попрощаться со старшей дочерью.","back":"Смерть Мармеладова\n«Преступление и наказание» (Ф.М. Достоевский)"},{"front":"Герой читает вместе с девушкой евангельскую притчу о воскресении Лазаря.","back":"Раскольников и Соня Мармеладова\n«Преступление и наказание» (Ф.М. Достоевский)"},{"front":"Герой влюбляется в девушку, услышав, как она с невероятным чувством поет арию «Casta Diva».","back":"Обломов и Ольга Ильинская\n«Обломов» (И.А. Гончаров)"},{"front":"Герой получает тяжелое ранение в голову, глядит в высокое небо и понимает ничтожность своего прежнего кумира — Наполеона.","back":"Ранение князя Андрея под Аустерлицем\n«Война и мир» (Л.Н. Толстой)"},{"front":"Герой видит на краю дороги старый засохший дуб, а через несколько недель замечает, что он зазеленел, что символизирует возрождение героя.","back":"Встреча князя Андрея с дубом\n«Война и мир» (Л.Н. Толстой)"},{"front":"Огромная Москва оставлена жителями. Герой, переодевшись в кучерское платье, остается в городе, чтобы убить Наполеона.","back":"Пьер Безухов в захваченной Москве\n«Война и мир» (Л.Н. Толстой)"}],"poems":[{"front":"«Любви, надежды, тихой славы\nНедолго нежил нас обман,\nИсчезли юные забавы,\nКак сон, как утренний туман...»","back":"А.С. Пушкин\n«К Чаадаеву»\n\nТема: вольнолюбивая лирика, призыв к пробуждению Родины."},{"front":"«Прощай, свободная стихия!\nВ последний раз передо мной\nТы катишь волны голубые\nИ блещешь гордою красой.»","back":"А.С. Пушкин\n«К морю»\n\nТема: философско-романтическая лирика, прощание со свободным идеалом."},{"front":"«Восстань, пророк, и виждь, и внемли,\nИсполнись волею моей,\nИ, обходя моря и земли,\nГлаголом жги сердца людей.»","back":"А.С. Пушкин\n«Пророк»\n\nТема: божественное предназначение поэта и поэзии."},{"front":"«Мчатся тучи, вьются тучи;\nНевидимкою луна\nОсвещает снег летучий;\nМутно небо, ночь мутна.»","back":"А.С. Пушкин\n«Бесы»\n\nТема: философская лирика, жизненная неприкаянность и страх перед стихией."},{"front":"«Белеет парус одинокой\nВ тумане моря голубом!.. —\nЧто ищет он в стране далекой?\nЧто кинул он в краю родном?..»","back":"М.Ю. Лермонтов\n«Парус»\n\nТема: философская лирика, мятежность, поиск смысла жизни."},{"front":"«Погиб поэт! — невольник чести —\nПал, оклеветанный молвой,\nС свинцом в груди и жаждой мести,\nПоникнув гордой головой!..»","back":"М.Ю. Лермонтов\n«Смерть Поэта»\n\nТема: трагическая судьба поэта, обличение жестокого светского общества."},{"front":"«Печально я гляжу на наше поколенье!\nЕго грядущее — иль пусто, иль темно,\nМеж тем, под бременем познанья и сомненья,\nВ бездействии состарится оно.»","back":"М.Ю. Лермонтов\n«Дума»\n\nТема: гражданская лирика, трагедия бездеятельного поколения."},{"front":"«Средь шумного бала, случайно,\nВ тревоге мирской суеты,\nТебя я увидел, но тайна\nТвои покрывала черты.»","back":"А.К. Толстой\n«Средь шумного бала, случайно...»\n\nТема: любовная лирика, зарождение трепетного чувства."},{"front":"«Колокольчики мои,\nЦветики степные!\nЧто глядите на меня,\nТёмно-голубые?»","back":"А.К. Толстой\n«Колокольчики мои...»\n\nТема: патриотическая и пейзажная лирика, любовь к родине."},{"front":"«Безмолвное море, лазурное море,\nСтою очарован над бездной твоей.\nТы живо; ты дышишь; смятенной любовью,\nТревожною думой наполнено ты.»","back":"В.А. Жуковский\n«Море»\n\nТема: пейзажно-философская (элегия), отражение человеческой души в стихии."},{"front":"«Люблю грозу в начале мая,\nКогда весенний, первый гром,\nКак бы резвяся и играя,\nГрохочет в небе голубом.»","back":"Ф.И. Тютчев\n«Весенняя гроза»\n\nТема: пейзажная лирика, жизнеутверждающее весеннее обновление."},{"front":"«Ещё в полях белеет снег,\nА воды уж весной шумят —\nБегут и будят сонный брег,\nБегут, и блещут, и гласят...»","back":"Ф.И. Тютчев\n«Весенние воды»\n\nТема: пейзажная лирика, радость весеннего пробуждения."},{"front":"«Умом Россию не понять,\nАршином общим не измерить:\nУ ней особенная стать —\nВ Россию можно только верить.»","back":"Ф.И. Тютчев\n«Умом Россию не понять...»\n\nТема: патриотическая лирика, иррациональная любовь к Родине."},{"front":"«Как сердцу высказать себя?\nДругому как понять тебя?\nПоймет ли он, чем ты живешь?\nМысль изреченная есть ложь.»","back":"Ф.И. Тютчев\n«Silentium!»\n\nТема: философская лирика, невыразимость чувств и богатство внутреннего мира."},{"front":"«О, как убийственно мы любим,\nКак в буйной слепоте страстей\nМы то всего вернее губим,\nЧто сердцу нашему милей!»","back":"Ф.И. Тютчев\n«О, как убийственно мы любим...»\n\nТема: любовная лирика (денисьевский цикл), разрушительная сила страсти."},{"front":"«Невозмутимый строй во всем,\nСозвучье полное в природе,\nЛишь в нашей призрачной свободе\nРазлад мы с нею сознаем.»","back":"Ф.И. Тютчев\n«Певучесть есть в морских волнах...»\n\nТема: философская лирика, разлад человека и природы."},{"front":"«Как поздней осени порою\nБывают дни, бывает час,\nКогда повеет вдруг весною\nИ что-то встрепенётся в нас...»","back":"Ф.И. Тютчев\n«К. Б.» («Я встретил вас — и всё былое...»)\n\nТема: любовная лирика, возрождение души через воспоминания."},{"front":"«Есть в осени первоначальной\nКороткая, но дивная пора —\nВесь день стоит как бы хрустальный,\nИ лучезарны вечера...»","back":"Ф.И. Тютчев\n«Есть в осени первоначальной...»\n\nТема: пейзажная лирика, умиротворенность и красота увядания."},{"front":"«Не то, что мните вы, природа:\nНе слепок, не бездушный лик —\nВ ней есть душа, в ней есть свобода,\nВ ней есть любовь, в ней есть язык...»","back":"Ф.И. Тютчев\n«Не то, что мните вы, природа...»\n\nТема: философская лирика, одухотворенность и разумность природы."},{"front":"«Нам не дано предугадать,\nКак слово наше отзовется,\n— И нам сочувствие дается,\nКак нам дается благодать...»","back":"Ф.И. Тютчев\n«Нам не дано предугадать...»\n\nТема: философская лирика, ответственность человека за свои слова и поступки."},{"front":"«Шепот, робкое дыханье,\nТрели соловья,\nСеребро и колыханье\nСонного ручья...»","back":"А.А. Фет\n«Шепот, робкое дыханье...»\n\nТема: интимная лирика, импрессионистическое описание свидания на фоне природы."},{"front":"«Сияла ночь. Луной был полон сад. Лежали\nЛучи у наших ног в гостиной без огней.\nРояль был весь раскрыт, и струны в нем дрожали...»","back":"А.А. Фет\n«Сияла ночь. Луной был полон сад...»\n\nТема: любовная лирика, всепобеждающая сила искусства и памяти."},{"front":"«Это утро, радость эта,\nЭта мощь и дня и света,\nЭтот синий свод,\nЭтот крик и вереницы...»","back":"А.А. Фет\n«Это утро, радость эта...»\n\nТема: пейзажная лирика, гимн красоте и торжеству весеннего утра."},{"front":"«Учись у них — у дуба, у берёзы.\nКругом зима. Жестокая пора!\nНапрасные на них застыли слезы,\nИ треснула, сжимаяся, кора.»","back":"А.А. Фет\n«Учись у них — у дуба, у берёзы...»\n\nТема: философская лирика, стойкость перед жизненными испытаниями."},{"front":"«Какая ночь! На всём какая нега!\nБлагодарю, родной полночный край!\nИз царства льдов, из царства вьюг и снега\nКак свеж и чист твой вылетает май!»","back":"А.А. Фет\n«Ещё майская ночь»\n\nТема: пейзажно-философская лирика, восторг перед красотой весенней ночи."},{"front":"«На пригорке то сыро, то жарко,\nВздохи дня есть в дыханьи ночном,\nНо зарница уж теплится ярко\nГолубым и зелёным огнём.»","back":"А.А. Фет\n«Вечер»\n\nТема: пейзажная лирика, гармония вечерней природы."},{"front":"«Что ты жадно глядишь на дорогу\nВ стороне от веселых подруг?\nЗнать, забило сердечко тревогу —\nВсе лицо твое вспыхнуло вдруг.»","back":"Н.А. Некрасов\n«Тройка»\n\nТема: гражданская лирика, тяжелая и бесправная доля русской крестьянки."},{"front":"«Пускай нам говорит изменчивая мода,\nЧто тема старая “страдания народа”\nИ что поэзия забыть ее должна.\nНе верьте, юноши! не стареет она.»","back":"Н.А. Некрасов\n«Элегия»\n\nТема: предназначение поэта, гражданский долг служения народу."},{"front":"«Труд этот, Ваня, был страшно громаден\nНе по плечу одному!\nВ мире есть царь: этот царь беспощаден,\nГолод названье ему.»","back":"Н.А. Некрасов\n«Железная дорога»\n\nТема: гражданская лирика, жестокая эксплуатация крестьян-строителей."},{"front":"«Поэтом можешь ты не быть,\nНо гражданином быть обязан.\nА что такое гражданин?\nОтечества достойный сын.»","back":"Н.А. Некрасов\n«Поэт и гражданин»\n\nТема: предназначение поэта, неразрывность искусства и общественного долга."},{"front":"«Я не люблю иронии твоей.\nОставь ее отжившим и не жившим,\nА нам с тобой, так горячо любившим,\nЕще остаток чувства сохранившим,\n— Нам рано предаваться ей!»","back":"Н.А. Некрасов\n«Я не люблю иронии твоей...»\n\nТема: любовная лирика (панаевский цикл), предчувствие разрыва и сложности взаимоотношений."},{"front":"«Поздняя осень. Грачи улетели,\nЛес обнажился, поля опустели,\nТолько не сжата полоска одна...\nГрустную думу наводит она.»","back":"Н.А. Некрасов\n«Несжатая полоса»\n\nТема: гражданская лирика, тяжелая крестьянская доля, бессилие перед бедой."}]},"variants":[{"id":"var_real_1","category":"real","title":"Реальный вариант №1","subtitle":"(И.А. Гончаров «Обломов», А.С. Пушкин «Пророк»)","data":{"text1":{"title":"И.А. Гончаров. «Обломов» (Фрагмент)","content":"— Где твои книги, переводы?\n— Захар куда-то дел, — отвечал Обломов, — тут где-нибудь в углу лежат.\n— В углу! — с упрёком сказал Штольц. — В этом же углу лежат и замыслы твои «служить, пока станет сил, потому что России нужны руки и головы для разработывания неистощимых источников (твои слова); работать, чтоб слаще отдыхать, а отдыхать значит жить другой, артистической, изящной стороной жизни, жизни художников, поэтов». Все эти замыслы тоже Захар сложил в угол? Помнишь, ты хотел после книг объехать чужие края, чтоб лучше знать и любить свой? «Вся жизнь есть мысль и труд, — твердил ты тогда, — труд хоть безвестный, тёмный, но непрерывный, и умереть с сознанием, что сделал своё дело». А? В каком углу лежит это у тебя?\n— Да... да... — говорил Обломов, беспокойно следя за каждым словом Штольца, — помню, что я точно... кажется... Как же, — сказал он, вдруг вспомнив прошлое, — ведь мы, Андрей, сбирались сначала изъездить вдоль и поперёк Европу, исходить Швейцарию пешком, обжечь ноги на Везувии, спуститься в Геркулан. С ума чуть не сошли! Сколько глупостей!..\n— Глупостей! — с упрёком повторил Штольц. <...> А как ты запирался с учителем математики, хотел непременно добиться, зачем тебе знать круги и квадраты, но на половине бросил и не добился? По-английски начал учиться... и не доучился! А когда я сделал план поездки за границу, звал заглянуть в германские университеты, ты вскочил, обнял меня и подал торжественно руку: «Я твой, Андрей, с тобой всюду» — это всё твои слова. Ты всегда был немножко актёр. Что ж, Илья? Я два раза был за границей, после нашей премудрости, смиренно сидел на студенческих скамьях в Бонне, в Иене, в Эрлангене, потом выучил Европу как своё имение. Но, положим, вояж — это роскошь, и не все в состоянии и обязаны пользоваться этим средством; а Россия? Я видел Россию вдоль и поперёк. Тружусь...\n— Когда-нибудь перестанешь же трудиться, — заметил Обломов.\n— Никогда не перестану. Для чего?\n— Когда удвоишь свои капиталы, — сказал Обломов.\n— Когда учетверю их, и тогда не перестану.\n— Так из чего же, — заговорил он, помолчав, — ты бьёшься, если цель твоя не обеспечить себя навсегда и удалиться потом на покой, отдохнуть?..\n— Деревенская обломовщина! — сказал Штольц.\n— Или достигнуть службой значения и положения в обществе и потом в почетном бездействии наслаждаться заслуженным отдыхом...\n— Петербургская обломовщина! — возразил Штольц.\n— Так когда же жить? — с досадой на замечания Штольца возразил Обломов. — Для чего же мучиться весь век?\n— Для самого труда, больше ни для чего. Труд — образ, содержание, стихия и цель жизни, по крайней мере моей. Вон ты выгнал труд из жизни: на что она похожа? Я попробую приподнять тебя, может быть в последний раз. Если ты и после этого будешь сидеть вот тут, с Тарантьевыми и Алексеевыми, то совсем пропадёшь, станешь в тягость даже себе. Теперь или никогда! — заключил он."},"text2":{"title":"А.С. Пушкин. «Пророк»","content":"Духовной жаждою томим,\nВ пустыне мрачной я влачился,\nИ шестикрылый серафим\nНа перепутье мне явился.\nПерстами лёгкими как сон\nМоих зениц коснулся он.\nОтверзлись вещие зеницы,\nКак у испуганной орлицы.\nМоих ушей коснулся он,\nИ их наполнил шум и звон:\nИ внял я неба содроганье,\nИ горний ангелов полёт,\nИ гад морских подводный ход,\nИ дольней лозы прозябанье.\nИ он к устам моим приник,\nИ вырвал грешный мой язык,\nИ празднословный и лукавый,\nИ жало мудрыя змеи\nВ уста замершие мои\nВложил десницею кровавой.\nИ он мне грудь рассёк мечом,\nИ сердце трепетное вынул,\nИ угль, пылающий огнём,\nВо грудь отверстую водвинул.\nКак труп в пустыне я лежал,\nИ бога глас ко мне воззвал:\n\n«Восстань, пророк, и виждь, и внемли,\nИсполнись волею моей,\nИ, обходя моря и земли,\nГлаголом жги сердца людей»."},"questions":[{"id":"q1","part":1,"displayNum":"1","type":"fill-blanks","instruction":"Заполните пропуски в предложенном тексте. Введите термины в именительном падеже.","textParts":["«Обломов» И.А. Гончарова относится к жанру ",". Особенностью построения этого произведения является то, что "," или часть сюжета, посвящённая предварительному знакомству читателя с местом действия и героями, занимает несколько глав."],"correctAnswers":[["роман","романа"],["экспозиция","экспозиция романа"]],"points":2,"explanation":"По объему и охвату явлений «Обломов» — это роман. Уникальной чертой романа является сильно затянутая экспозиция (знакомство с героем и местом действия занимает всю первую часть)."},{"id":"q2_1","part":1,"displayNum":"2.1","type":"short-text","instruction":"В разговоре с Обломовым Штольц упоминает о книгах («Где твои книги, переводы?»). Эта значимая подробность является ..., которая помогает понять образ героя.","correct":["деталь","художественная деталь"],"points":1,"explanation":"Значимая подробность, несущая смысловую нагрузку и помогающая раскрыть характер героя — это художественная деталь."},{"id":"q2_2","part":1,"displayNum":"2.2","type":"short-text","instruction":"Характеризуя жизнь Обломова, Штольц использует выражение «В этом же углу лежат и замыслы твои...». В данном случае используется ..., то есть перенос свойств одного явления на другое по их сходству.","correct":["метафора","метафорой"],"points":1,"explanation":"Скрытое сравнение, основанное на сходстве, называется метафорой (замыслы не могут буквально «лежать» в углу)."},{"id":"q2_3","part":1,"displayNum":"2.3","type":"single-choice","instruction":"Выберите верное утверждение, характеризующее предложенный фрагмент произведения И.А. Гончарова.","options":[{"id":"r1","text":"Захар имеет сильное влияние на Обломова, который во всём готов слушаться слугу."},{"id":"r2","text":"Обломов — тонко чувствующий человек с горячим сердцем, и Штольц ценит дружбу с ним."},{"id":"r3","text":"Андрей Штольц умело скрывает презрение к ленивому и праздному Обломову."},{"id":"r4","text":"Штольцу удалось спасти Обломова от обломовщины, в которую Илья Ильич погружён."}],"correctOption":"r2","points":1,"explanation":"Штольц искренне пытается «приподнять» друга, так как ценит его добрую душу, несмотря на прогрессирующую лень."},{"id":"q3","part":1,"displayNum":"3","type":"multiple-choice","instruction":"Выберите два верных утверждения, характеризующих образ Ольги Ильинской.","options":[{"id":"c1","text":"Героиня — эмансипированная женщина, которой претит домашняя атмосфера.","isCorrect":false},{"id":"c2","text":"Ольга Ильинская оценила в Обломове «голубиную душу», преданное сердце.","isCorrect":true},{"id":"c3","text":"Ольга пыталась изменить Обломова, пробудить в нём стремление быть деятельным человеком.","isCorrect":true},{"id":"c4","text":"Ольгу Ильинскую сближает с Обломовым нежелание ничего менять в своей жизни.","isCorrect":false},{"id":"c5","text":"Ольга не смогла обрести счастья в замужестве, которое стало для неё тяжёлым испытанием.","isCorrect":false}],"points":2,"explanation":"Ольга полюбила искренность Обломова и активно пыталась его переделать (пробудить к жизни), что в итоге привело к разрыву."},{"id":"q4","part":1,"displayNum":"4","type":"matching","instruction":"Установите соответствие между героями романа и их характеристиками.","leftCol":[{"id":"l1","text":"А. Штольц"},{"id":"l2","text":"Б. Обломов"},{"id":"l3","text":"В. Захар"}],"rightCol":["1. «Он весь составлен из костей, мускулов и нервов, как кровная английская лошадь».","2. «Он задумчиво сидел в креслах, в своей лениво красивой позе, не замечая, что вокруг него делалось...»","3. «Если ему приказывали сделать что-нибудь сверх этого, он исполнял приказание неохотно...»","4. «...в каждом зажиточном доме толпится рой подобных лиц обоего пола...»"],"correctMapping":{"l1":"1. «Он весь составлен из костей, мускулов и нервов...»","l2":"2. «Он задумчиво сидел в креслах...»","l3":"3. «Если ему приказывали сделать что-нибудь сверх этого...»"},"points":2,"explanation":"Штольц показан как человек дела («из мускулов и нервов»), Обломов — как апатичный мечтатель, а Захар — как ленивый, но верный слуга.","correctIdx":{"l1":0,"l2":1,"l3":2}},{"id":"q5","part":1,"displayNum":"5","type":"matching","instruction":"Установите соответствие между героями романа и фактами их судьбы.","leftCol":[{"id":"l1","text":"А. Обломов"},{"id":"l2","text":"Б. Штольц"},{"id":"l3","text":"В. Захар"}],"rightCol":["1. будет просить милостыню на паперти","2. будет уличён в мошенничестве","3. сделает успешную карьеру","4. окажется жертвой обманщиков"],"correctMapping":{"l1":"4. окажется жертвой обманщиков","l2":"3. сделает успешную карьеру","l3":"1. будет просить милостыню на паперти"},"points":2,"explanation":"Обломов становится жертвой махинаций Тарантьева и Мухоярова; Штольц добивается жизненного успеха; Захар оказывается нищим стариком на паперти.","correctIdx":{"l1":3,"l2":2,"l3":0}},{"id":"q6","part":1,"displayNum":"6","type":"sequence","instruction":"Определите последовательность указанных эпизодов в сюжете романа «Обломов». Впишите последовательность цифр без пробелов.","items":[{"id":"1","text":"Женитьба Штольца"},{"id":"2","text":"Знакомство Обломова и Ольги"},{"id":"3","text":"Сон об Обломовке"},{"id":"4","text":"Приезд гостей (Волков, Судьбинский...)"}],"correctAnswer":"4321","points":1,"explanation":"Приезд гостей (4) происходит в первой части; затем Обломов засыпает и видит Сон (3); позже Штольц знакомит его с Ольгой (2); женитьба Штольца на Ольге (1) происходит уже в конце романа."},{"id":"q7","part":1,"displayNum":"7","type":"multiple-choice","instruction":"Выберите все верные утверждения, характеризующие произведение И.А. Гончарова.","options":[{"id":"c1","text":"В конце жизни Илья Ильич возвращается в родовую Обломовку, в которой и умирает.","isCorrect":false},{"id":"c2","text":"Обломов поехал со Штольцем за границу и познакомился там с Ольгой Ильинской.","isCorrect":false},{"id":"c3","text":"Автор последовательно противопоставляет в романе Обломова и Штольца.","isCorrect":true},{"id":"c4","text":"Агафья Пшеницына искренне любит Обломова и закладывает ради его благополучия личные вещи.","isCorrect":true},{"id":"c5","text":"Захар был искренне привязан к Обломову и в конце жизни отказывается уезжать далеко от его могилы.","isCorrect":true}],"points":2,"explanation":"Обломов умирает на Выборгской стороне, так и не доехав ни до Обломовки, ни до заграницы. Агафья Пшеницына и Захар демонстрируют безграничную, жертвенную преданность барину."},{"id":"q8","part":2,"displayNum":"8","type":"short-text","instruction":"Выпишите из текста (А.С. Пушкин. «Пророк») устаревшее слово, которое означает «слово, речь» (в нужной форме).","correct":["глаголом","глагол"],"points":1,"explanation":"Устаревшее слово «глагол» в строке «Глаголом жги сердца людей» означает «слово, речь, истина»."},{"id":"q9","part":2,"displayNum":"9","type":"matching","instruction":"Установите соответствие между выделенными примерами из текста и названиями художественных приёмов.","leftCol":[{"id":"l1","text":"А. «Отверзлись вещие зеницы, / **Как у испуганной орлицы**»"},{"id":"l2","text":"Б. «И вырвал **грешный** мой язык, / И **празднословный** и **лукавый**...»"},{"id":"l3","text":"В. «И, обходя моря и земли, / **Глаголом жги сердца людей**»"}],"rightCol":["1. гипербола","2. метафора","3. эпитет","4. сравнение"],"correctMapping":{"l1":"4. сравнение","l2":"3. эпитет","l3":"2. метафора"},"points":2,"explanation":"Союз «как» указывает на сравнение; образные прилагательные — это эпитеты; «жги сердца глаголом» — скрытое сравнение, метафора.","correctIdx":{"l1":3,"l2":2,"l3":1}},{"id":"q10","part":2,"displayNum":"10","type":"fill-blanks","instruction":"В предложенном стихотворении определите: 1) размер без указания количества стоп; 2) тип рифмовки в первых четырёх строках.","textParts":["1) Размер: ",", 2) Рифмовка: ","."],"correctAnswers":[["ямб","ямбом"],["перекрестная","перекрёстная","перекрестная рифмовка","перекрёстная рифмовка"]],"points":2,"explanation":"Размер стихотворения — ямб. В первых четырёх строках рифмуются 1-я и 3-я строки (томим — серафим), 2-я и 4-я (влачился — явился): рифмовка перекрёстная (АБАБ)."},{"id":"q11","part":2,"displayNum":"11","type":"single-choice","instruction":"Какая тема определяет идейное содержание стихотворения А.С. Пушкина «Пророк»?","options":[{"id":"r1","text":"тема религиозного открытия"},{"id":"r2","text":"тема жизни и смерти"},{"id":"r3","text":"тема созерцания природы"},{"id":"r4","text":"тема назначения поэта"}],"correctOption":"r4","points":1,"explanation":"Через библейский сюжет Пушкин раскрывает тему божественного, высокого предназначения поэта и поэзии."},{"id":"q12","part":2,"displayNum":"12","type":"multiple-choice","instruction":"Выберите два верных утверждения, характеризующих произведение А.С. Пушкина.","options":[{"id":"c1","text":"Задача лирического героя — нести истину людям.","isCorrect":true},{"id":"c2","text":"Образ орлицы подчёркивает чувство страха героя.","isCorrect":false},{"id":"c3","text":"Разговорная лексика создаёт исторический колорит.","isCorrect":false},{"id":"c4","text":"В стихотворении раскрывается момент перерождения героя.","isCorrect":true},{"id":"c5","text":"Лирический герой измождён и погибает в пустыне.","isCorrect":false}],"points":2,"explanation":"В стихотворении показан мучительный процесс духовного перерождения человека в пророка, миссия которого — нести истину («глаголом жечь сердца людей»)."},{"id":"q13","part":3,"displayNum":"13","type":"matching","instruction":"Установите соответствие между героями и названиями произведений, к которым они относятся.","leftCol":[{"id":"l1","text":"А. Ермил Гирин"},{"id":"l2","text":"Б. Лебезятников"},{"id":"l3","text":"В. Кулигин"},{"id":"l4","text":"Г. Денисов"},{"id":"l5","text":"Д. Мухояров"}],"rightCol":["1. «Обломов» (И.А. Гончаров)","2. «Война и мир» (Л.Н. Толстой)","3. «Кому на Руси жить хорошо» (Н.А. Некрасов)","4. «Отцы и дети» (И.С. Тургенев)","5. «Преступление и наказание» (Ф.М. Достоевский)","6. «Гроза» (А.Н. Островский)"],"correctMapping":{"l1":"3. «Кому на Руси жить хорошо» (Н.А. Некрасов)","l2":"5. «Преступление и наказание» (Ф.М. Достоевский)","l3":"6. «Гроза» (А.Н. Островский)","l4":"2. «Война и мир» (Л.Н. Толстой)","l5":"1. «Обломов» (И.А. Гончаров)"},"points":2,"explanation":"Гирин — крестьянин из поэмы Некрасова; Лебезятников — пошлый радикал у Достоевского; Кулигин — самоучка у Островского; Денисов — гусар-партизан у Толстого; Мухояров — вороватый чиновник у Гончарова.","correctIdx":{"l1":2,"l2":4,"l3":5,"l4":1,"l5":0}},{"id":"q14","part":3,"displayNum":"14","type":"multiple-choice","instruction":"В каких из перечисленных произведений местом действия является Петербург? Выберите все верные варианты.","options":[{"id":"c1","text":"«Гроза» А.Н. Островского","isCorrect":false},{"id":"c2","text":"«Отцы и дети» И.С. Тургенева","isCorrect":false},{"id":"c3","text":"«Кому на Руси жить хорошо» Н.А. Некрасова","isCorrect":false},{"id":"c4","text":"«Война и мир» Л.Н. Толстого","isCorrect":true},{"id":"c5","text":"«Преступление и наказание» Ф.М. Достоевского","isCorrect":true}],"points":2,"explanation":"Петербург — место действия всего романа «Преступление и наказание» и ряда важнейших сцен (салон Анны Шерер) в «Войне и мире»."},{"id":"q15","part":3,"displayNum":"15","type":"matching","instruction":"По предложенным фрагментам определите названия стихотворений.","leftCol":[{"id":"l1","text":"А. «На пригорке то сыро, то жарко,\nВздохи дня есть в дыханьи ночном...»"},{"id":"l2","text":"Б. «...служа искусству,\nДля блага ближнего живи,\nСвой гений подчиняя чувству...»"},{"id":"l3","text":"В. «Как поздней осени порою\nБывают дни, бывает час,\nКогда повеет вдруг весною...»"},{"id":"l4","text":"Г. «Как сердцу высказать себя?\nДругому как понять тебя?\nПоймёт ли он, чем ты живёшь?»"}],"rightCol":["1. «К. Б.» («Я встретил вас — и всё былое...»)","2. «Это утро, радость эта...»","3. «Поэт и Гражданин»","4. «Silentium!»","5. «Вечер»","6. «Поэт»"],"correctMapping":{"l1":"5. «Вечер»","l2":"3. «Поэт и Гражданин»","l3":"1. «К. Б.» («Я встретил вас — и всё былое...»)","l4":"4. «Silentium!»"},"points":2,"explanation":"Фрагменты А (Фет) — пейзаж из «Вечера»; Б (Некрасов) — строки из «Поэта и Гражданина»; В (Тютчев) — размышления о возрождении чувств из «К. Б.»; Г (Тютчев) — философский призыв из «Silentium!».","correctIdx":{"l1":4,"l2":2,"l3":0,"l4":3}},{"id":"q16","part":3,"displayNum":"16","type":"single-choice","instruction":"В каком из предложенных стихотворений лирический герой восхищается обновлением природы?","options":[{"id":"r1","text":"Ф.И. Тютчев. «Весенняя гроза»"},{"id":"r2","text":"А.А. Фет. «Одним толчком согнать ладью живую...»"},{"id":"r3","text":"Н.А. Некрасов. «Вчерашний день, часу в шестом...»"},{"id":"r4","text":"Ф.И. Тютчев. «Нам не дано предугадать...»"}],"correctOption":"r1","points":1,"explanation":"Именно в «Весенней грозе» Тютчева звучит восторженное упоение динамичной, живой, обновляющейся природой («Люблю грозу в начале мая...»)."}]}},{"id":"var_real_2","category":"real","title":"Реальный вариант №2","subtitle":"(А.Н. Островский «Гроза», А.А. Фет)","data":{"text1":{"title":"А.Н. Островский. «Гроза» (Фрагмент)","content":"Кулигин. Что у вас, сударь, за дела с ним? Не поймём мы никак. Охота вам жить у него да брань переносить.\n\nБорис. Уж какая охота, Кулигин! Неволя.\n\nКулигин. Да какая же неволя, сударь, позвольте вас спросить. Коли можно, сударь, так скажите нам.\n\nБорис. Отчего ж не сказать? Знали бабушку нашу, Анфису Михайловну?\n\nКулигин. Ну, как не знать!\n\nКудряш. Как не знать!\n\nБорис. Батюшку она ведь невзлюбила за то, что он женился на благородной. По этому-то случаю батюшка с матушкой и жили в Москве. Матушка рассказывала, что она трёх дней не могла ужиться с роднёй, уж очень ей дико казалось.\n\nКулигин. Ещё бы не дико! Уж что говорить! Большую привычку нужно, сударь, иметь.\n\nБорис. Воспитывали нас родители в Москве хорошо, ничего для нас не жалели. Меня отдали в Коммерческую академию, а сестру в пансион, да оба вдруг и умерли в холеру; мы с сестрой сиротами и остались. Потом мы слышим, что и бабушка здесь умерла и оставила завещание, чтобы дядя нам заплатил часть, какую следует, когда мы придём в совершеннолетие, только с условием.\n\nКулигин. С каким же, сударь?\n\nБорис. Если мы будем к нему почтительны.\n\nКулигин. Это значит, сударь, что вам наследства вашего не видать никогда.\n\nБорис. Да нет, этого мало, Кулигин! Он прежде наломается над нами, наругается всячески, как его душе угодно, а кончит всё-таки тем, что не даст ничего или так, какую-нибудь малость. Да ещё станет рассказывать, что из милости дал, что и этого бы не следовало.\n\nКудряш. Уж это у нас в купечестве такое заведение. Опять же, хоть бы вы и были к нему почтительны, нешто кто ему запретит сказать-то, что вы непочтительны?\n\nБорис. Ну да. Уж он и теперь поговаривает иногда: «У меня свои дети, за что я чужим деньги отдам? Чрез это я своих обидеть должен!»\n\nКулигин. Значит, сударь, плохо ваше дело.\n\nБорис. Кабы я один, так бы ничего! Я бы бросил всё да уехал. А то сестру жаль. Он было и её выписывал, да матушкины родные не пустили, написали, что больна. Какова бы ей здесь жизнь была, и представить страшно.\n\nКудряш. Уж само собой. Нешто они обращение понимают?\n\nКулигин. Как же вы у него живёте, сударь, на каком положении?\n\nБорис. Да ни на каком: «Живи, говорит, у меня, делай, что прикажут, а жалованья, что положу». То есть через год разочтёт, как ему будет угодно.\n\nКудряш. У него уж такое заведение. У нас никто и пикнуть не смей о жалованье, изругает на чём свет стоит.\n\nКулигин. Что ж делать-то, сударь! Надо стараться угождать как-нибудь.\n\nБорис. В том-то и дело, Кулигин, что никак невозможно. На него и свои-то никак угодить не могут; а уж где ж мне!"},"text2":{"title":"А.А. Фет. «Сияла ночь. Луной был полон сад. Лежали...»","content":"Сияла ночь. Луной был полон сад. Лежали\nЛучи у наших ног в гостиной без огней.\nРояль был весь раскрыт, и струны в нём дрожали,\nКак и сердца у нас за песнию твоей.\n\nТы пела до зари, в слезах изнемогая,\nЧто ты одна — любовь, что нет любви иной,\nИ так хотелось жить, чтоб, звука не роняя,\nТебя любить, обнять и плакать над тобой.\n\nИ много лет прошло, томительных и скучных,\nИ вот в тиши ночной твой голос слышу вновь,\nИ веет, как тогда, во вздохах этих звучных,\nЧто ты одна — вся жизнь, что ты одна — любовь.\n\nЧто нет обид судьбы и сердца жгучей муки,\nА жизни нет конца, и цели нет иной,\nКак только веровать в рыдающие звуки,\nТебя любить, обнять и плакать над тобой!"},"questions":[{"id":"q1","part":1,"displayNum":"1","type":"fill-blanks","instruction":"Заполните пропуски в предложенном тексте. Введите термины в именительном падеже.","textParts":["Произведение А.Н. Островского «Гроза» относится к жанру ",". Краткое высказывание одного действующего лица в пьесе называется ","."],"correctAnswers":[["драма","драмы"],["реплика","репликой"]],"points":2,"explanation":"Пьесы по жанру относятся к драме. Краткое высказывание персонажа в диалоге — это реплика."},{"id":"q2_1","part":1,"displayNum":"2.1","type":"short-text","instruction":"В предложенном фрагменте герои обсуждают жизнь Бориса в доме дяди. Обмен высказываниями между действующими лицами называется...","correct":["диалог","диалогом"],"points":1,"explanation":"Диалог — форма речи, представляющая собой разговор двух или более лиц."},{"id":"q2_2","part":1,"displayNum":"2.2","type":"short-text","instruction":"Герои эмоционально реагируют на высказывания друг друга («Уж какая охота, Кулигин!»; «Ещё бы не дико!»). Такие обороты речи, произнесённые с особой интонацией, называются...","correct":["риторические восклицания","риторическое восклицание","восклицания","восклицание","восклицательные предложения"],"points":1,"explanation":"Риторическое восклицание — высказывание в восклицательной форме, которое передаёт сильное чувство говорящего и усиливает выразительность речи. Реплики героев выражают раздражение и иронию по отношению к Дикому."},{"id":"q2_3","part":1,"displayNum":"2.3","type":"single-choice","instruction":"Выберите верное утверждение, характеризующее предложенный фрагмент произведения А.Н. Островского.","options":[{"id":"r1","text":"Борис незаслуженно наговаривает на дядю, который с нежностью относится к племяннику."},{"id":"r2","text":"Кулигин надеется, что Борис поможет ему поставить в городе громоотвод."},{"id":"r3","text":"Кудряш как настоящий купец хорошо знает и понимает поведение людей своего круга."},{"id":"r4","text":"Борис в разговоре раскрывает характер одного из самодуров города Калинова."}],"correctOption":"r4","points":1,"explanation":"Через свой рассказ Борис раскрывает жестокую натуру своего дяди — Дикого, типичного самодура."},{"id":"q3","part":1,"displayNum":"3","type":"sequence","instruction":"Установите хронологическую последовательность событий пьесы «Гроза». Впишите последовательность цифр без пробелов.","items":[{"id":"1","text":"Отъезд Тихона в Москву"},{"id":"2","text":"Встреча Катерины с Борисом в саду"},{"id":"3","text":"Гроза и покаяние"},{"id":"4","text":"Отъезд Бориса"}],"correctAnswer":"1234","points":1,"explanation":"Тихон уезжает (1), что позволяет устроить встречу в саду (2). Затем начинается гроза (3). После этого Дикой отправляет Бориса в Кяхту (4)."},{"id":"q4","part":1,"displayNum":"4","type":"matching","instruction":"Установите соответствие между персонажами и их репликами.","leftCol":[{"id":"l1","text":"А. Кулигин"},{"id":"l2","text":"Б. Варвара"},{"id":"l3","text":"В. Катерина"}],"rightCol":["1. «Жестокие нравы, сударь, в нашем городе, жестокие!»","2. «Я давно вижу, что вам воли хочется».","3. «А по-моему: делай что хочешь, только бы шито да крыто было».","4. «А уж коли очень мне здесь опостынет, так не удержат меня никакой силой»."],"correctMapping":{"l1":"1. «Жестокие нравы...»","l2":"3. «А по-моему: делай что хочешь...»","l3":"4. «А уж коли очень мне здесь опостынет...»"},"points":2,"explanation":"Слова о жестоких нравах произносит Кулигин. Жизненное кредо Варвары — «шито да крыто». Катерина же демонстрирует свой отчаянный характер.","correctIdx":{"l1":0,"l2":2,"l3":3}},{"id":"q5","part":1,"displayNum":"5","type":"matching","instruction":"Установите соответствие между персонажами и их репликами.","leftCol":[{"id":"l1","text":"А. Дикой"},{"id":"l2","text":"Б. Кабаниха"},{"id":"l3","text":"В. Борис"}],"rightCol":["1. «Что обо мне-то толковать! Я вольная птица».","2. «Себя погубишь, людей соблазнишь... Много, много народу в грех введёшь!»","3. «Может, я с тобой и говорить-то не хочу. Ты должен был прежде узнать, в расположении ли я тебя слушать...»","4. «...гостей позовут, посадить не умеют <...>. Смех, да и только!»"],"correctMapping":{"l1":"3. «Может, я с тобой и говорить-то не хочу...»","l2":"2. «Себя погубишь, людей соблазнишь...»","l3":"4. «...гостей позовут, посадить не умеют <...>. Смех, да и только!»"},"points":2,"explanation":"Дикой упивается своей властью (реплика 3); Кабаниха пугает и морализирует (реплика 2); Борис рассказывает о чуждости местных порядков (реплика 4).","correctIdx":{"l1":2,"l2":1,"l3":3}},{"id":"q6","part":1,"displayNum":"6","type":"multiple-choice","instruction":"Выберите все верные утверждения, характеризующие произведение А.Н. Островского.","options":[{"id":"c1","text":"Кабанова насаждает свою волю всем членам семьи.","isCorrect":true},{"id":"c2","text":"Борис готов пойти против воли дяди ради любви к Катерине.","isCorrect":false},{"id":"c3","text":"В финале произведения Тихон обвиняет мать в гибели жены.","isCorrect":true},{"id":"c4","text":"Прилюдное покаяние Катерины в грехе — кульминация пьесы.","isCorrect":true},{"id":"c5","text":"Жизнь Катерины в родительском доме была очень тяжёлой.","isCorrect":false}],"points":2,"explanation":"Борис оказался трусом и не пошел против дяди. Жизнь Катерины в детстве, наоборот, была беззаботной («как птичка на воле»)."},{"id":"q8","part":2,"displayNum":"8","type":"short-text","instruction":"Выпишите из текста (А.А. Фет. «Сияла ночь...») слово, которое означает «отсутствие звуков, шума» (в нужной форме).","correct":["тиши","тишь"],"points":1,"explanation":"Слово «тиши» (в строке «И вот в тиши ночной...») означает тишину, безмолвие."},{"id":"q9","part":2,"displayNum":"9","type":"matching","instruction":"Установите соответствие между выделенными примерами из текста и названиями художественных приёмов.","leftCol":[{"id":"l1","text":"А. «...**лежали / Лучи** у наших ног в гостиной без огней.»"},{"id":"l2","text":"Б. «И много лет прошло, **томительных и скучных**...»"},{"id":"l3","text":"В. «**И вот** в тиши ночной твой голос слышу вновь,\n**И веет**, как тогда...»"}],"rightCol":["1. гипербола","2. эпитет","3. анафора","4. олицетворение"],"correctMapping":{"l1":"4. олицетворение","l2":"2. эпитет","l3":"3. анафора"},"points":2,"explanation":"Лучи наделяются человеческим свойством «лежать» (олицетворение); образные прилагательные — эпитеты; повтор союза «И» в начале строк — анафора.","correctIdx":{"l1":3,"l2":1,"l3":2}},{"id":"q10","part":2,"displayNum":"10","type":"fill-blanks","instruction":"В предложенном стихотворении определите: 1) размер без указания количества стоп; 2) тип рифмовки.","textParts":["1) Размер: ",", 2) Рифмовка: ","."],"correctAnswers":[["ямб","ямбом"],["перекрестная","перекрёстная","перекрестная рифмовка"]],"points":2,"explanation":"Размер — ямб. Рифмовка — перекрестная (АБАБ)."},{"id":"q11","part":2,"displayNum":"11","type":"single-choice","instruction":"Какая тема определяет идейное содержание стихотворения А.А. Фета?","options":[{"id":"r1","text":"тема трагического одиночества"},{"id":"r2","text":"тема романтических сновидений"},{"id":"r3","text":"тема любовного откровения"},{"id":"r4","text":"тема музыкального творчества"}],"correctOption":"r3","points":1,"explanation":"Главный мотив стихотворения — всепобеждающая сила любви и искусства (музыки), переданная через форму глубокого любовного откровения."},{"id":"q12","part":2,"displayNum":"12","type":"multiple-choice","instruction":"Выберите два верных утверждения, характеризующих произведение А.А. Фета.","options":[{"id":"c1","text":"Мотив песни передаёт искреннюю любовь героини.","isCorrect":true},{"id":"c2","text":"В стихотворении соотносится прошлое и настоящее.","isCorrect":true},{"id":"c3","text":"Лирический герой испытывает чувство глубокого разочарования.","isCorrect":false},{"id":"c4","text":"Анафора в последней строфе подчёркивает душевную боль героя.","isCorrect":false},{"id":"c5","text":"Герой видит смысл жизни в музыкальном самовыражении.","isCorrect":false}],"points":2,"explanation":"Стихотворение построено на воспоминании (прошлое и настоящее), а пение героини передает силу искренней любви."},{"id":"q13","part":3,"displayNum":"13","type":"matching","instruction":"Установите соответствие между героями и названиями произведений.","leftCol":[{"id":"l1","text":"А. Борис Друбецкой"},{"id":"l2","text":"Б. Порфирий Петрович"},{"id":"l3","text":"В. Тарантьев"},{"id":"l4","text":"Г. Кудряш"},{"id":"l5","text":"Д. Ситников"}],"rightCol":["1. «Обломов»","2. «Война и мир»","3. «Кому на Руси жить хорошо»","4. «Отцы и дети»","5. «Преступление и наказание»","6. «Гроза»"],"correctMapping":{"l1":"2. «Война и мир»","l2":"5. «Преступление и наказание»","l3":"1. «Обломов»","l4":"6. «Гроза»","l5":"4. «Отцы и дети»"},"points":2,"explanation":"Борис Друбецкой — карьерист у Толстого; Порфирий Петрович — следователь у Достоевского; Тарантьев — шулер у Гончарова; Кудряш — конторщик у Островского; Ситников — псевдонигилист у Тургенева.","correctIdx":{"l1":1,"l2":4,"l3":0,"l4":5,"l5":3}},{"id":"q14","part":3,"displayNum":"14","type":"multiple-choice","instruction":"Кто из перечисленных героев погибает в финале произведения? Выберите все верные варианты.","options":[{"id":"c1","text":"Борис (А.Н. Островский. «Гроза»)","isCorrect":false},{"id":"c2","text":"Аркадий Кирсанов (И.С. Тургенев. «Отцы и дети»)","isCorrect":false},{"id":"c3","text":"Штольц (И.А. Гончаров. «Обломов»)","isCorrect":false},{"id":"c4","text":"Петя Ростов (Л.Н. Толстой. «Война и мир»)","isCorrect":true},{"id":"c5","text":"Свидригайлов (Ф.М. Достоевский. «Преступление и наказание»)","isCorrect":true}],"points":2,"explanation":"Петя Ростов трагически гибнет в бою. Свидригайлов, разочаровавшись в жизни, совершает самоубийство."},{"id":"q15","part":3,"displayNum":"15","type":"matching","instruction":"По предложенным фрагментам определите названия стихотворений.","leftCol":[{"id":"l1","text":"А. «Как слово наше отзовётся\nИ нам сочувствие даётся...»"},{"id":"l2","text":"Б. «Нет, никогда нежней и бестелесней\nТвой лик, о ночь, не мог меня томить...»"},{"id":"l3","text":"В. «Эти зори без затменья,\nЭтот вздох ночной селенья,\nЭта ночь без сна...»"},{"id":"l4","text":"Г. «Пока ещё застенчиво и нежно\nСвидание продлить желаешь ты...»"}],"rightCol":["1. «Нам не дано предугадать...»","2. «Ещё майская ночь»","3. «Пророк»","4. «Это утро, радость эта...»","5. «Я не люблю иронии твоей...»","6. «Не то, что мните вы, природа...»"],"correctMapping":{"l1":"1. «Нам не дано предугадать...»","l2":"2. «Ещё майская ночь»","l3":"4. «Это утро, радость эта...»","l4":"5. «Я не люблю иронии твоей...»"},"points":2,"explanation":"А (Тютчев) — «Нам не дано предугадать...»; Б (Фет) — пейзажное «Ещё майская ночь»; В (Фет) — «Это утро, радость эта...»; Г (Некрасов) — любовная лирика «Я не люблю иронии твоей...».","correctIdx":{"l1":0,"l2":1,"l3":3,"l4":4}},{"id":"q16","part":3,"displayNum":"16","type":"single-choice","instruction":"В каком из предложенных стихотворений отражён мотив стойкости человека перед жизненными испытаниями?","options":[{"id":"r1","text":"А.А. Фет. «Учись у них — у дуба, у берёзы...»"},{"id":"r2","text":"Ф.И. Тютчев. «Умом Россию не понять...»"},{"id":"r3","text":"А.С. Пушкин. «К***» («Я помню чудное мгновенье...»)"},{"id":"r4","text":"А.К. Толстой. «Средь шумного бала, случайно...»"}],"correctOption":"r1","points":1,"explanation":"В стихотворении «Учись у них — у дуба, у березы...» Фет призывает человека учиться у природы молчаливой стойкости перед жестокими ударами судьбы."}]}},{"id":"var_real_3","category":"real","title":"Реальный вариант №3","subtitle":"(Ф.М. Достоевский «Преступление и наказание», В.А. Жуковский «Море»)","data":{"text1":{"title":"Ф.М. Достоевский. «Преступление и наказание» (Фрагмент)","content":"Он хотел было улыбнуться, но что-то бессильное и недоконченное сказалось в его бледной улыбке. Он склонил голову и закрыл руками лицо.\n\nИ вдруг странное, неожиданное ощущение какой-то едкой ненависти к Соне прошло по его сердцу. Как бы удивясь и испугавшись сам этого ощущения, он вдруг поднял голову и пристально поглядел на неё; но он встретил на себе беспокойный и до муки заботливый взгляд её; тут была любовь; ненависть его исчезла, как призрак. Это было не то; он принял одно чувство за другое. Это только значило, что та минута пришла.\n\nОпять он закрыл руками лицо и склонил вниз голову. Вдруг он побледнел, встал со стула, посмотрел на Соню и, ничего не выговорив, пересел машинально на её постель.\n\nЭта минута была ужасно похожа, в его ощущении, на ту, когда он стоял за старухой, уже высвободив из петли топор, и почувствовал, что уже «ни мгновения нельзя было терять более».\n\n— Что с вами? — спросила Соня, ужасно оробевшая.\n\nОн ничего не мог выговорить. Он совсем, совсем не так предполагал объявить и сам не понимал того, что теперь с ним делалось. Она тихо подошла к нему, села на постель подле и ждала, не сводя с него глаз. Сердце её стучало и замирало. Стало невыносимо: он обернул к ней мёртво-бледное лицо своё; губы его бессильно кривились, усиливаясь что-то выговорить. Ужас прошёл по сердцу Сони.\n\n— Что с вами? — повторила она, слегка от него отстраняясь.\n\n— Ничего, Соня. Не пугайся... Вздор! Право, если рассудить, — вздор, — бормотал он с видом себя не помнящего человека в бреду. — Зачем только тебя-то я пришёл мучить? — прибавил он вдруг, смотря на неё. — Право. Зачем? Я всё задаю себе этот вопрос, Соня...\n\nОн, может быть, и задавал себе этот вопрос четверть часа назад, но теперь проговорил в полном бессилии, едва себя сознавая и ощущая беспрерывную дрожь во всём своём теле.\n\n— Ох, как вы мучаетесь! — с страданием произнесла она, вглядываясь в него."},"text2":{"title":"В.А. Жуковский. «Море»","content":"Безмолвное море, лазурное море,\nСтою очарован над бездной твоей.\nТы живо; ты дышишь; смятенной любовью,\nТревожною думой наполнено ты.\nБезмолвное море, лазурное море,\nОткрой мне глубокую тайну твою:\nЧто движет твоё необъятное лоно?\nЧем дышит твоя напряжённая грудь?\nИль тянет тебя из земныя неволи\nДалёкое светлое небо к себе?..\nТаинственной, сладостной полное жизни,\nТы чисто в присутствии чистом его:\nТы льёшься его светозарной лазурью,\nВечерним и утренним светом горишь,\nЛаскаешь его облака золотые\nИ радостно блещешь звездами его.\nКогда же сбираются тёмные тучи,\nЧтоб ясное небо отнять у тебя —\nТы бьёшься, ты воешь, ты волны подъемлешь,\nТы рвёшь и терзаешь враждебную мглу...\nИ мгла исчезает, и тучи уходят,\nНо, полное прошлой тревоги своей,\nТы долго вздымаешь испуганны волны,\nИ сладостный блеск возвращённых небес\nНе вовсе тебе тишину возвращает;\nОбманчив твоей неподвижности вид:\nТы в бездне покойной скрываешь смятенье,\nТы, небом любуясь, дрожишь за него."},"questions":[{"id":"q1","part":1,"displayNum":"1","type":"fill-blanks","instruction":"Заполните пропуски в предложенном тексте. Введите термины в именительном падеже.","textParts":["Раскольников — "," произведения Ф.М. Достоевского «Преступление и наказание». Эпизод признания Раскольникова в убийстве является ",", так как это один из самых напряжённых моментов произведения."],"correctAnswers":[["главный герой","герой","главный персонаж"],["кульмина
