цией","кульминация"]],"points":2,"explanation":"Раскольников — главный герой романа. Эпизод признания является моментом наивысшего напряжения (кульминацией) его психологических терзаний."},{"id":"q2_1","part":1,"displayNum":"2.1","type":"short-text","instruction":"Описывая значимость переживаемой минуты, Раскольников вспоминает о топоре: «когда он стоял за старухой, уже высвободив из петли топор». Подробность, придающая повествованию особую выразительность, называется...","correct":["художественная деталь","деталь","художественной деталью","деталью"],"points":1,"explanation":"Деталь — выразительная подробность в произведении (в данном случае топор — важнейшая смысловая деталь романа)."},{"id":"q2_2","part":1,"displayNum":"2.2","type":"short-text","instruction":"В предложенном фрагменте подробно описано состояние Раскольникова: «И вдруг странное, неожиданное ощущение какой-то едкой ненависти...». Такое изображение внутренних переживаний героя называется...","correct":["психологизм","психологизмом","тайный психологизм"],"points":1,"explanation":"Психологизм — способность литературы глубоко изображать внутренний мир и душевные терзания человека."},{"id":"q2_3","part":1,"displayNum":"2.3","type":"single-choice","instruction":"Выберите верное утверждение, характеризующее предложенный фрагмент произведения Ф.М. Достоевского.","options":[{"id":"r1","text":"Находясь на каторге, Раскольников решился признаться Соне в любви."},{"id":"r2","text":"Совершив убийство, Раскольников сразу прибегает к Соне домой."},{"id":"r3","text":"Раскольников признаётся Соне в совершённом преступлении."},{"id":"r4","text":"Раскольников не знает, как рассказать Соне о гибели Мармеладова."}],"correctOption":"r3","points":1,"explanation":"В данном фрагменте описывается тяжелейший момент признания Раскольникова Соне в двойном убийстве (Алены Ивановны и Лизаветы)."},{"id":"q3","part":1,"displayNum":"3","type":"sequence","instruction":"Определите последовательность указанных эпизодов в сюжете произведения. Впишите последовательность цифр без пробелов.","items":[{"id":"1","text":"Раскольников получает письмо от матери."},{"id":"2","text":"Похороны Мармеладова."},{"id":"3","text":"Убийство Алёны Ивановны."},{"id":"4","text":"Замужество Дуни."}],"correctAnswer":"1324","points":1,"explanation":"В начале романа герой получает длинное письмо от матери (1). Затем идет на убийство старухи (3). В середине книги происходят поминки Мармеладова (2). В самом конце (в эпилоге) мы узнаем о свадьбе Дуни (4)."},{"id":"q4","part":1,"displayNum":"4","type":"matching","instruction":"Установите соответствие между героинями и их характеристиками.","leftCol":[{"id":"l1","text":"А. Катерина Ивановна"},{"id":"l2","text":"Б. Лизавета"},{"id":"l3","text":"В. Дуня"}],"rightCol":["1. «Тут было столько жалкого, столько страдающего в этом искривлённом болью, высохшем чахоточном лице...»","2. «...собой ужасно нескладная, росту замечательно высокого...»","3. «Её даже нельзя было назвать и хорошенькою, но зато голубые глаза её были такие ясные...»","4. «...замечательно хороша собою — высокая, удивительно стройная, сильная, самоуверенная...»"],"correctMapping":{"l1":"1. «Тут было столько жалкого...»","l2":"2. «...собой ужасно нескладная, росту замечательно высокого...»","l3":"4. «...замечательно хороша собою...»"},"points":2,"explanation":"Красавица Дуня горда и уверена в себе; Катерина Ивановна измучена чахоткой и нищетой; Лизавета — рослая, безответная и нескладная женщина.","correctIdx":{"l1":0,"l2":1,"l3":3}},{"id":"q5","part":1,"displayNum":"5","type":"matching","instruction":"Установите соответствие между героями и их поступками.","leftCol":[{"id":"l1","text":"А. Разумихин"},{"id":"l2","text":"Б. Порфирий Петрович"},{"id":"l3","text":"В. Мармеладов"}],"rightCol":["1. оставляет деньги семье Мармеладовых","2. женится на Дуне","3. погибает, попав под лошадь","4. добивается смягчения наказания Раскольникову"],"correctMapping":{"l1":"2. женится на Дуне","l2":"4. добивается смягчения наказания Раскольникову","l3":"3. погибает, попав под лошадь"},"points":2,"explanation":"Разумихин становится мужем Дуни; следователь Порфирий учитывает явку с повинной; Мармеладов погибает в уличной аварии.","correctIdx":{"l1":1,"l2":3,"l3":2}},{"id":"q7","part":1,"displayNum":"7","type":"multiple-choice","instruction":"Выберите все верные утверждения, характеризующие произведение Ф.М. Достоевского.","options":[{"id":"c1","text":"Авдотья Раскольникова выходит замуж за Лужина.","isCorrect":false},{"id":"c2","text":"Свидригайлов покончил жизнь самоубийством.","isCorrect":true},{"id":"c3","text":"Разумихин пытается помочь Раскольникову, заботится о нём.","isCorrect":true},{"id":"c4","text":"Лужина и Свидригайлова называют двойниками Раскольникова.","isCorrect":true},{"id":"c5","text":"Раскольников растратил всё, что забрал у старухи-процентщицы.","isCorrect":false}],"points":2,"explanation":"Дуня разрывает помолвку с Лужиным. Раскольников так и не воспользовался украденным, спрятав его под камнем. Лужин и Свидригайлов воплощают крайние (доведенные до абсурда) черты теории героя, поэтому их называют «двойниками»."},{"id":"q8","part":2,"displayNum":"8","type":"short-text","instruction":"Выпишите из текста (В.А. Жуковский. «Море») слово, которое означает «бездонную пропасть, неизмеримую глубину» (в нужной форме).","correct":["бездна","бездной","бездну","бездне"],"points":1,"explanation":"Слово «бездна» (в строках «Стою очарован над бездной твоей», «Ты в бездне покойной...») обозначает неизмеримую глубину."},{"id":"q9","part":2,"displayNum":"9","type":"matching","instruction":"Установите соответствие между выделенными примерами из текста и названиями художественных приёмов.","leftCol":[{"id":"l1","text":"А. «**Ты** бьёшься, **ты** воешь, **ты** волны подъемлешь...»"},{"id":"l2","text":"Б. «Ты живо; ты дышишь...»"},{"id":"l3","text":"В. «Ласкаешь его **облака золотые**...»"}],"rightCol":["1. антитеза","2. олицетворение","3. инверсия","4. повтор"],"correctMapping":{"l1":"4. повтор","l2":"2. олицетворение","l3":"3. инверсия"},"points":2,"explanation":"Многократное использование «Ты» — лексический повтор (анафора). Море, которое «дышит», — это олицетворение. Изменение прямого порядка слов («облака золотые» вместо «золотые облака») — инверсия.","correctIdx":{"l1":3,"l2":1,"l3":2}},{"id":"q10","part":2,"displayNum":"10","type":"fill-blanks","instruction":"В предложенном стихотворении определите: 1) размер без указания количества стоп; 2) название выделенного приёма в последних строках («Ты в бездне... Ты, небом...»).","textParts":["1) Размер: ",", 2) Приём: ","."],"correctAnswers":[["амфибрахий","амфибрахием"],["анафора","анафорой"]],"points":2,"explanation":"Размер — амфибрахий (трехсложная стопа с ударением на втором слоге: Без-мОлв-но-е). Единоначатие строк («Ты... Ты...») — анафора."},{"id":"q11","part":2,"displayNum":"11","type":"single-choice","instruction":"Какая тема определяет идейное содержание стихотворения В.А. Жуковского?","options":[{"id":"r1","text":"выражение глубины человеческих переживаний"},{"id":"r2","text":"пробуждение патриотического порыва"},{"id":"r3","text":"разочарование в дружеском участии"},{"id":"r4","text":"протест против повседневных тревог"}],"correctOption":"r1","points":1,"explanation":"«Море» Жуковского — философская элегия, где состояние морской стихии является отражением глубин человеческой души и ее стремления к идеалу (небу)."},{"id":"q12","part":2,"displayNum":"12","type":"multiple-choice","instruction":"Выберите два верных утверждения, характеризующих произведение В.А. Жуковского.","options":[{"id":"c1","text":"Лирический герой скорбит об ушедшей юности.","isCorrect":false},{"id":"c2","text":"Море отражает динамику чувств лирического героя.","isCorrect":true},{"id":"c3","text":"Стихотворение В.А. Жуковского является элегией.","isCorrect":true},{"id":"c4","text":"Лирический герой погибает в морской пучине.","isCorrect":false},{"id":"c5","text":"Буря передаёт враждебность моря по отношению к герою.","isCorrect":false}],"points":2,"explanation":"Стихотворение относится к жанру элегии, а море в духе романтизма выступает как живое существо, отражающее богатую динамику человеческих чувств."},{"id":"q13","part":3,"displayNum":"13","type":"matching","instruction":"Установите соответствие между героями и названиями произведений.","leftCol":[{"id":"l1","text":"А. Дикой"},{"id":"l2","text":"Б. Лебезятников"},{"id":"l3","text":"В. Долохов"},{"id":"l4","text":"Г. Аркадий"},{"id":"l5","text":"Д. Савелий"}],"rightCol":["1. «Обломов»","2. «Война и мир»","3. «Кому на Руси жить хорошо»","4. «Отцы и дети»","5. «Преступление и наказание»","6. «Гроза»"],"correctMapping":{"l1":"6. «Гроза»","l2":"5. «Преступление и наказание»","l3":"2. «Война и мир»","l4":"4. «Отцы и дети»","l5":"3. «Кому на Руси жить хорошо»"},"points":2,"explanation":"Дикой — самодур («Гроза»); Лебезятников — пошляк («П и Н»); Долохов — бретер («Война и мир»); Аркадий — приятель Базарова («Отцы и дети»); Савелий — персонаж поэмы Некрасова.","correctIdx":{"l1":5,"l2":4,"l3":1,"l4":3,"l5":2}},{"id":"q14","part":3,"displayNum":"14","type":"multiple-choice","instruction":"Выберите, кто из перечисленных героинь обретает счастье в замужестве.","options":[{"id":"c1","text":"Катерина (А.Н. Островский. «Гроза»)","isCorrect":false},{"id":"c2","text":"Фенечка (И.С. Тургенев. «Отцы и дети»)","isCorrect":true},{"id":"c3","text":"Агафья Пшеницына (И.А. Гончаров. «Обломов»)","isCorrect":true},{"id":"c4","text":"Соня (Л.Н. Толстой. «Война и мир»)","isCorrect":false},{"id":"c5","text":"Лизавета (Ф.М. Достоевский. «Преступление и наказание»)","isCorrect":false}],"points":2,"explanation":"Фенечка законно венчается с Кирсановым, Агафья же Пшеницына обретает истинное женское счастье, ухаживая за Обломовым."},{"id":"q15","part":3,"displayNum":"15","type":"matching","instruction":"По предложенным фрагментам определите названия стихотворений.","leftCol":[{"id":"l1","text":"А. «Ты скажешь: ветреная Геба,\nКормя Зевесова орла...»"},{"id":"l2","text":"Б. «Молчи, скрывайся и таи\nИ чувства и мечты свои...»"},{"id":"l3","text":"В. «Послушай: стыдно!\nПора вставать! Ты знаешь сам...»"},{"id":"l4","text":"Г. «Поздняя осень. Грачи улетели,\nЛес обнажился, поля опустели...»"}],"rightCol":["1. «Поэт и гражданин»","2. «Весенняя гроза»","3. «Silentium!»","4. «К морю»","5. «Несжатая полоса»","6. «19 октября»"],"correctMapping":{"l1":"2. «Весенняя гроза»","l2":"3. «Silentium!»","l3":"1. «Поэт и гражданин»","l4":"5. «Несжатая полоса»"},"points":2,"explanation":"Фрагмент А (Тютчев) — «Весенняя гроза»; Б (Тютчев) — «Silentium!»; В (Некрасов) — «Поэт и гражданин»; Г (Некрасов) — «Несжатая полоса».","correctIdx":{"l1":1,"l2":2,"l3":0,"l4":4}},{"id":"q16","part":3,"displayNum":"16","type":"single-choice","instruction":"В каком из предложенных стихотворений создаётся гармоничная картина природы?","options":[{"id":"r1","text":"А.К. Толстой. «Средь шумного бала, случайно...»"},{"id":"r2","text":"Н.А. Некрасов. «Вчерашний день, часу в шестом...»"},{"id":"r3","text":"А.С. Пушкин. «Бесы»"},{"id":"r4","text":"Ф.И. Тютчев. «Есть в осени первоначальной...»"}],"correctOption":"r4","points":1,"explanation":"Только у Тютчева («Есть в осени первоначальной...») показана светлая, умиротворенная гармония осенней природы."}]}},{"id":"var_train_1","category":"training","title":"Тренировочный вариант №1","subtitle":"(Л.Н. Толстой «Война и мир», Ф.И. Тютчев)","data":{"text1":{"title":"Л.Н. Толстой. «Война и мир» (Том 2, часть 3)","content":"Уже было начало июня, когда князь Андрей, возвращаясь домой, въехал опять в ту березовую рощу, в которой этот старый, корявый дуб так странно и памятно поразил его. Бубенчики еще глуше звенели в лесу, чем месяц тому назад; всё было полно, тенисто и густо; и молодые ели, рассыпанные по лесу, не нарушали общей красоты и, подделываясь под общий характер, нежно зеленели пушистыми молодыми побегами.\n\n«Да, здесь, в этом лесу, был этот дуб, с которым мы были согласны», — подумал князь Андрей. «Да где он?» — подумал опять князь Андрей, глядя на левую сторону дороги и, сам того не зная, не узнавая его, любовался тем дубом, которого он искал."},"text2":{"title":"Ф.И. Тютчев. «Весенняя гроза»","content":"Люблю грозу в начале мая,\nКогда весенний, первый гром,\nКак бы резвяся и играя,\nГрохочет в небе голубом.\n\nГремят раскаты молодые,\nВот дождик брызнул, пыль летит,\nПовисли перлы дождевые,\nИ солнце нити золотит."},"questions":[{"id":"q1","part":1,"displayNum":"1","type":"fill-blanks","instruction":"Заполните пропуски в предложенном тексте. Введите термины в именительном падеже.","textParts":["Жанр произведения Л.Н. Толстого «Война и мир» определяют как ",". В нём нашли отражение черты "," — ведущего направления литературы второй половины XIX века."],"correctAnswers":[["роман-эпопея","роман эпопея","эпопея"],["реализма","реализм"]],"points":2,"explanation":"«Война и мир» сочетает масштабные исторические события с частными судьбами героев, что характерно для романа-эпопеи. Ведущее направление второй половины XIX века — реализм."},{"id":"q2_1","part":1,"displayNum":"2.1","type":"short-text","instruction":"Как называется описание природы в художественном произведении (например, описание березовой рощи)?","correct":["пейзаж","пейзажа","пейзажный"],"points":1,"explanation":"Пейзаж — изображение картин природы в художественном произведении."},{"id":"q2_2","part":1,"displayNum":"2.2","type":"short-text","instruction":"Как называется форма психологизма, передающая скрытые, невысказанные мысли героя (размышления князя Андрея)?","correct":["внутренняя речь","внутренний монолог","монолог"],"points":1,"explanation":"Внутренняя речь (внутренний монолог) — средство психологизма, передающее невысказанные мысли героя в их естественном течении."},{"id":"q2_3","part":1,"displayNum":"2.3","type":"true-false","instruction":"Определите, верны ли следующие утверждения по Тексту 1.","items":[{"id":"i1","text":"Князь Андрей проезжал через сосновый бор.","correct":"Неверно"},{"id":"i2","text":"Молодые ели органично вписывались в общую картину леса.","correct":"Верно"},{"id":"i3","text":"Князь Андрей сразу узнал старый дуб при второй встрече.","correct":"Неверно"}],"points":2,"explanation":"В тексте четко сказано, что роща была березовая (а не сосновый бор), а князь Андрей любовался дубом, «не узнавая его»."},{"id":"q3","part":1,"displayNum":"3","type":"sequence","instruction":"Установите хронологическую последовательность событий жизненного пути князя Андрея. Впишите последовательность цифр без пробелов.","items":[{"id":"1","text":"Бородинское сражение"},{"id":"2","text":"Сражение при Аустерлице"},{"id":"3","text":"Первый бал Наташи Ростовой"},{"id":"4","text":"Встреча со старым дубом"}],"correctAnswer":"2431","points":1,"explanation":"Сражение при Аустерлице (2) -> Встреча со старым дубом (4) -> Первый бал Наташи Ростовой (3) -> Бородинское сражение (1)."},{"id":"q4","part":1,"displayNum":"4","type":"matching","instruction":"Установите соответствие между героями романа и их цитатами.","leftCol":[{"id":"l1","text":"А. Пьер Безухов"},{"id":"l2","text":"Б. Андрей Болконский"},{"id":"l3","text":"В. Платон Каратаев"}],"rightCol":["1. «Нет, жизнь не кончена в тридцать один год... Надо, чтобы все знали меня...»","2. «Надо жить, надо любить, надо верить, что живем не нынче только...»","3. «Не тужи, дружок: час терпеть, а век жить! Вот так-то...»","4. «Ему казалось, что только теперь он узнал всю сладость...»"],"correctMapping":{"l1":"2. «Надо жить, надо любить, надо верить...»","l2":"1. «Нет, жизнь не кончена в тридцать один год...»","l3":"3. «Не тужи, дружок: час терпеть, а век жить!»"},"points":2,"explanation":"Слова о вере принадлежат Пьеру, о возрождении — Андрею, народная мудрость — Каратаеву.","correctIdx":{"l1":1,"l2":0,"l3":2}}]}},{"id":"var_train_2","category":"training","title":"Тренировочный Вариант №2","subtitle":"(А.Н. Островский «Гроза», А.А. Фет)","data":{"text1":{"title":"А.Н. Островский. «Гроза» (Фрагмент)","content":"Катерина. Отчего люди не летают так, как птицы? Знаешь, мне иногда кажется, что я птица. Когда стоишь на горе, так тебя и тянет лететь. Вот так бы разбежалась, подняла руки и полетела. Попробовать нешто теперь? (Хочет бежать.)\n\nВарвара. Что ты выдумываешь-то?\n\nКатерина (вздыхая). Какая я была резвая! Я у вас завяла совершенно.\n\nВарвара. Ты думаешь, я не вижу?\n\nКатерина. Такая ли я была! Я жила, ни об чем не тужила, точно птичка на воле. Маменька во мне души не чаяла, наряжала меня, как куклу, работать не принуждала; что хочу, бывало, то и делаю."},"text2":{"title":"А.А. Фет. «Шепот, робкое дыханье...»","content":"Шепот, робкое дыханье,\nТрели соловья,\nСеребро и колыханье\nСонного ручья,\n\nСвет ночной, ночные тени,\nТени без конца,\nРяд волшебных изменений\nМилого лица,\n\nВ дымных тучках пурпур розы,\nОтблеск янтаря,\nИ лобзания, и слезы,\nИ заря, заря!.."},"questions":[{"id":"q1","part":1,"displayNum":"1","type":"fill-blanks","instruction":"Заполните пропуски в предложенном тексте. Введите термины в именительном падеже.","textParts":["Литературный род, к которому принадлежит пьеса «Гроза», называется ",". В произведении нашли отражение черты "," — ведущего направления литературы второй половины XIX века."],"correctAnswers":[["драма","драмы"],["реализма","реализм"]],"points":2,"explanation":"Правильный ответ: драма, реализм. Пьесы, предназначенные для постановки на сцене, по своей природе относятся к роду литературы «драма». Направление творчества Островского — реализм."},{"id":"q2_1","part":1,"displayNum":"2.1","type":"short-text","instruction":"Как называется обмен репликами между Катериной и Варварой в приведенном фрагменте?","correct":["диалог","диалога"],"points":1,"explanation":"Диалог — форма речи, представляющая собой непосредственный разговор двух или более лиц."},{"id":"q2_2","part":1,"displayNum":"2.2","type":"short-text","instruction":"Как называется авторское пояснение, сопровождающее речь персонажей (например: «вздыхая», «Хочет бежать»)?","correct":["ремарка","ремарки","авторская ремарка"],"points":1,"explanation":"Ремарка — это специальное замечание автора в тексте пьесы, поясняющее обстановку на сцене, действия, жесты или эмоции героев."},{"id":"q2_3","part":1,"displayNum":"2.3","type":"true-false","instruction":"Определите, верны ли следующие утверждения по Тексту 1.","items":[{"id":"i1","text":"Катерина сравнивает свою жизнь в доме Кабановых с жизнью птицы на воле.","correct":"Неверно"},{"id":"i2","text":"Варвара замечает изменения в душевном состоянии Катерины.","correct":"Верно"},{"id":"i3","text":"В детстве, до замужества, Катерина чувствовала себя свободной и счастливой.","correct":"Верно"}],"points":2,"explanation":"Катерина сравнивает с «птичкой на воле» свою ПРОШЛУЮ жизнь в родительском доме, а вот у Кабановых она, по ее же словам, совершенно «завяла»."}]}},{"id":"var_train_3","category":"training","title":"Тренировочный Вариант №3","subtitle":"(А.Н. Островский «Гроза», Н.А. Некрасов)","data":{"text1":{"title":"А.Н. Островский. «Гроза» (Действие 3, явление 3)","content":"Кулигин. Жестокие нравы, сударь, в нашем городе, жестокие! В мещанстве, сударь, вы ничего, кроме грубости да бедности нагольной, не увидите. И никогда нам, сударь, не выбиться из этой коры! Потому что честным трудом никогда не заработать нам больше насущного хлеба. А у кого деньги, сударь, тот старается бедного закабалить, чтобы на его труды даровые еще больше денег наживать...\n\nА между собой-то, сударь, как живут! Торговлю друг у друга подрывают, и не столько из корысти, сколько из зависти. Враждуют друг на друга; залучают в свои высокие-то хоромы пьяных приказных, таких, сударь, приказных, что и вида-то человеческого на нем нет, обличье-то человеческое потеряно. А те им, за малую толику, на гербовых листах злостные кляузы строчат на ближних."},"text2":{"title":"Н.А. Некрасов. «Элегия» (фрагмент)","content":"Пускай нам говорит изменчивая мода,\nЧто тема старая «страдания народа»\nИ что поэзия забыть ее должна.\nНе верьте, юноши! не стареет она.\nО, если бы ее могли состарить годы!\nПроцвел бы божий мир!.. Увы! пока народы\nВлачатся в нищете, покорствуя бичам,\nКак тощие стада по скошенным лугам,\nОплакивать их рок, служить им будет муза..."},"questions":[{"id":"q1","part":1,"displayNum":"1","type":"fill-blanks","instruction":"Заполните пропуски в предложенном тексте. Введите термины в именительном падеже.","textParts":["Жанр произведения А.Н. Островского «Гроза» определяют как ",". В пьесе ярко проявились черты "," — ведущего направления литературы второй половины XIX века."],"correctAnswers":[["драма","драмы","трагедия","трагедии"],["реализма","реализм"]],"points":2,"explanation":"Правильный ответ: драма, реализм. По жанру и роду это произведение относится к драме. Творческий метод Островского — реализм."},{"id":"q2_1","part":1,"displayNum":"2.1","type":"short-text","instruction":"Как называется развернутое, пространное высказывание одного персонажа (речь Кулигина в Тексте 1)?","correct":["монолог","монолога","развернутый монолог"],"points":1,"explanation":"Монолог — это речь действующего лица, выключенная из разговорного обмена репликами, обращенная к себе или слушателям."},{"id":"q2_2","part":1,"displayNum":"2.2","type":"short-text","instruction":"Как называется стилистическая фигура — эмоциональное высказывание в форме восклицания, которое не требует ответа и усиливает выразительность речи («А между собой-то, сударь, как живут!»)?","correct":["риторическое восклицание","риторические восклицания","восклицание"],"points":1,"explanation":"Риторическое восклицание — высказывание в восклицательной форме, которое усиливает эмоциональность речи и не требует ответа. Кулигин восклицанием передаёт горечь от нравов Калинова."},{"id":"q2_3","part":1,"displayNum":"2.3","type":"true-false","instruction":"Определите, верны ли следующие утверждения по Тексту 1.","items":[{"id":"i1","text":"Кулигин утверждает, что честным трудом в Калинове можно легко разбогатеть.","correct":"Неверно"},{"id":"i2","text":"Богатые горожане стремятся закабалить бедных для получения еще большей выгоды.","correct":"Верно"},{"id":"i3","text":"В городе процветают взаимная поддержка и купеческая благотворительность.","correct":"Неверно"}],"points":2,"explanation":"Кулигин прямо и с горечью говорит, что «честным трудом никогда не заработать нам больше насущного хлеба», а среди купцов царит бесконечная вражда и зависть."}]}},{"id":"var_auth_1","category":"authored","title":"Авторский вариант №1","subtitle":"(И.С. Тургенев «Отцы и дети», Ф.И. Тютчев «Есть в осени первоначальной…»)","data":{"text1":{"title":"И.С. Тургенев. «Отцы и дети» (Фрагмент главы X)","content":"— Я уже говорил вам, дядюшка, что мы не признаём авторитетов, — вмешался Аркадий.\n— Мы действуем в силу того, что мы признаём полезным, — промолвил Базаров. — В теперешнее время полезнее всего отрицание — мы отрицаем.\n— Всё?\n— Всё.\n— Как? не только искусство, поэзию... но и... страшно вымолвить...\n— Всё, — с невыразимым спокойствием повторил Базаров.\nПавел Петрович уставился на него. Он этого не ожидал, а Аркадий даже покраснел от удовольствия.\n— Однако позвольте, — заговорил Николай Петрович. — Вы всё отрицаете, или, выражаясь точнее, вы всё разрушаете... Да ведь надобно же и строить.\n— Это уже не наше дело... Сперва нужно место расчистить.\n— Современное состояние народа этого требует, — с важностью прибавил Аркадий, — мы должны исполнять эти требования, мы не имеем права предаваться удовлетворению личного эгоизма.\nЭта последняя фраза, видимо, не понравилась Базарову; от неё веяло философией, то есть романтизмом, ибо Базаров и философию называл романтизмом; но он не почёл за нужное опровергать своего молодого ученика.\n— Нет, нет! — воскликнул с внезапным порывом Павел Петрович, — я не хочу верить, что вы, господа, точно знаете русский народ, что вы представители его потребностей, его стремлений! Нет, русский народ не такой, каким вы его воображаете. Он свято чтит предания, он — патриархальный, он не может жить без веры...\n— Я не стану против этого спорить, — перебил Базаров, — я даже готов согласиться, что в этом вы правы.\n— А если я прав...\n— И всё-таки это ничего не доказывает.\n— Именно ничего не доказывает, — повторил Аркадий с уверенностию опытного шахматного игрока, который предвидел опасный, по-видимому, ход противника и потому нисколько не смутился.\n— Как ничего не доказывает? — пробормотал изумлённый Павел Петрович. — Стало быть, вы идёте против своего народа?\n— А хоть бы и так? — воскликнул Базаров."},"text2":{"title":"Ф.И. Тютчев. «Есть в осени первоначальной…»","content":"Есть в осени первоначальной\nКороткая, но дивная пора —\nВесь день стоит как бы хрустальный,\nИ лучезарны вечера...\n\nГде бодрый серп гулял и падал колос,\nТеперь уж пусто всё — простор везде, —\nЛишь паутины тонкий волос\nБлестит на праздной борозде.\n\nПустеет воздух, птиц не слышно боле,\nНо далеко ещё до первых зимних бурь —\nИ льётся чистая и тёплая лазурь\nНа отдыхающее поле..."},"questions":[{"id":"q1","part":1,"displayNum":"1","type":"fill-blanks","instruction":"Заполните пропуски в предложенном тексте. Введите термины в именительном падеже.","textParts":["«Отцы и дети» И.С. Тургенева относятся к литературному роду ",", а по жанру это ",", в основе которого лежит спор двух поколений и двух общественных лагерей."],"correctAnswers":[["эпос","эпосу"],["роман","романа","социально-психологический роман"]],"points":2,"explanation":"«Отцы и дети» — эпическое произведение: в нём есть повествователь, развёрнутый сюжет и система персонажей. Жанр — роман: широкий охват действительности, несколько сюжетных линий, история героя на фоне эпохи."},{"id":"q2_1","part":1,"displayNum":"2.1","type":"short-text","instruction":"В основе фрагмента лежит столкновение противоположных взглядов Базарова и Кирсановых. Острое столкновение характеров, взглядов и жизненных принципов, движущее действие произведения, называется...","correct":["конфликт","конфликтом","идейный конфликт"],"points":1,"explanation":"Конфликт — столкновение характеров, взглядов, жизненных принципов. Здесь он идейный: нигилизм Базарова против «принсипов» Павла Петровича."},{"id":"q2_2","part":1,"displayNum":"2.2","type":"short-text","instruction":"Уверенность Аркадия автор передаёт словами: «с уверенностию опытного шахматного игрока». Уподобление одного явления другому по общему признаку называется...","correct":["сравнение","сравнением"],"points":1,"explanation":"Сравнение — уподобление одного предмета или явления другому по общему признаку. Показатель сравнения здесь — конструкция «с уверенностию опытного шахматного игрока» (как опытный шахматист)."},{"id":"q2_3","part":1,"displayNum":"2.3","type":"single-choice","instruction":"Выберите верное утверждение, характеризующее предложенный фрагмент произведения И.С. Тургенева.","options":[{"id":"r1","text":"Спор ведут Базаров и Аркадий, который отстаивает взгляды старшего поколения."},{"id":"r2","text":"Базаров готов согласиться с Павлом Петровичем в оценке народа, но считает, что это ничего не доказывает."},{"id":"r3","text":"Николай Петрович поддерживает программу отрицания и предлагает немедленно начать разрушение."},{"id":"r4","text":"Павел Петрович соглашается с мыслью о том, что «сперва нужно место расчистить»."}],"correctOption":"r2","points":1,"explanation":"Базаров прямо говорит: «я даже готов согласиться, что в этом вы правы» — и тут же добавляет: «И всё-таки это ничего не доказывает». Аркадий во фрагменте на стороне Базарова, Николай Петрович возражает («надобно же и строить»), Павел Петрович спорит до конца."},{"id":"q3","part":1,"displayNum":"3","type":"sequence","instruction":"Установите хронологическую последовательность событий романа «Отцы и дети». Впишите последовательность цифр без пробелов.","items":[{"id":"1","text":"Знакомство с Одинцовой на балу у губернатора"},{"id":"2","text":"Смерть Базарова"},{"id":"3","text":"Приезд Базарова и Аркадия в Марьино"},{"id":"4","text":"Дуэль Базарова с Павлом Петровичем"}],"correctAnswer":"3142","points":1,"explanation":"Друзья приезжают в Марьино (3), затем в городе знакомятся с Одинцовой (1). После возвращения в Марьино происходит дуэль с Павлом Петровичем (4). Финал романа — заражение крови и смерть Базарова (2). Верный порядок: 3142."},{"id":"q4","part":1,"displayNum":"4","type":"matching","instruction":"Установите соответствие между персонажами романа и их репликами в предложенном фрагменте.","leftCol":[{"id":"l1","text":"А. Базаров"},{"id":"l2","text":"Б. Павел Петрович"},{"id":"l3","text":"В. Аркадий"}],"rightCol":["1. «В теперешнее время полезнее всего отрицание — мы отрицаем».","2. «Я уже говорил вам, дядюшка, что мы не признаём авторитетов».","3. «Русский народ не такой, каким вы его воображаете. Он свято чтит предания...»","4. «Вы всё отрицаете, или, выражаясь точнее, вы всё разрушаете... Да ведь надобно же и строить»."],"correctMapping":{"l1":"1. «В теперешнее время полезнее всего отрицание — мы отрицаем».","l2":"3. «Русский народ не такой, каким вы его воображаете. Он свято чтит предания...»","l3":"2. «Я уже говорил вам, дядюшка, что мы не признаём авторитетов»."},"points":2,"explanation":"Базарову принадлежит формула отрицания, Павлу Петровичу — защита патриархального народа, Аркадию — заявление о непризнании авторитетов. Четвёртая реплика («надобно же и строить») принадлежит Николаю Петровичу.","correctIdx":{"l1":0,"l2":2,"l3":1}},{"id":"q5","part":1,"displayNum":"5","type":"matching","instruction":"Установите соответствие между героями романа и их дальнейшей судьбой.","leftCol":[{"id":"l1","text":"А. Евгений Базаров"},{"id":"l2","text":"Б. Аркадий Кирсанов"},{"id":"l3","text":"В. Анна Одинцова"}],"rightCol":["1. женится на Кате Одинцовой и становится хозяйственным помещиком","2. умирает от заражения крови, полученного при вскрытии тела тифозного больного","3. выходит замуж не по любви, а по убеждению — за будущего общественного деятеля","4. уезжает за границу и доживает свой век в Дрездене"],"correctMapping":{"l1":"2. умирает от заражения крови, полученного при вскрытии тела тифозного больного","l2":"1. женится на Кате Одинцовой и становится хозяйственным помещиком","l3":"3. выходит замуж не по любви, а по убеждению — за будущего общественного деятеля"},"points":2,"explanation":"Базаров умирает от заражения крови после вскрытия тифозного больного. Аркадий женится на Кате и становится помещиком. Одинцова в эпилоге выходит замуж по убеждению. Дрезден — судьба Павла Петровича.","correctIdx":{"l1":1,"l2":0,"l3":2}},{"id":"q6","part":1,"displayNum":"6","type":"multiple-choice","instruction":"Выберите все верные утверждения, характеризующие произведение И.С. Тургенева.","options":[{"id":"c1","text":"Конфликт романа имеет и общественный, и семейный характер: спор поколений накладывается на спор демократа с аристократом.","isCorrect":true},{"id":"c2","text":"Базаров называет себя нигилистом и отрицает авторитеты, искусство и «принсипы».","isCorrect":true},{"id":"c3","text":"Спор с Павлом Петровичем заканчивается тем, что Базаров отказывается от своих взглядов.","isCorrect":false},{"id":"c4","text":"Испытание любовью к Одинцовой обнаруживает в Базарове того «романтика», которого он в себе отрицал.","isCorrect":true},{"id":"c5","text":"Повествование ведётся от первого лица — от имени Аркадия Кирсанова.","isCorrect":false}],"points":2,"explanation":"Верны первое, второе и четвёртое утверждения. Базаров своих взглядов не меняет — он гибнет, так и не отрекшись от них; повествование ведётся от третьего лица, повествователь не является персонажем."},{"id":"q8","part":2,"displayNum":"8","type":"short-text","instruction":"Выпишите из текста (Ф.И. Тютчев. «Есть в осени первоначальной…») устаревшую форму слова «более» в том виде, в каком она употреблена в стихотворении.","correct":["боле"],"points":1,"explanation":"«Пустеет воздух, птиц не слышно боле» — «боле» — устаревшая (усечённая) форма слова «более», характерная для поэтического языка XIX века."},{"id":"q9","part":2,"displayNum":"9","type":"matching","instruction":"Установите соответствие между выделенными примерами из текста и названиями художественных средств.","leftCol":[{"id":"l1","text":"А. «Весь день стоит как бы хрустальный»"},{"id":"l2","text":"Б. «паутины тонкий волос»"},{"id":"l3","text":"В. «На отдыхающее поле»"}],"rightCol":["1. сравнение","2. метафора","3. олицетворение","4. гипербола"],"correctMapping":{"l1":"1. сравнение","l2":"2. метафора","l3":"3. олицетворение"},"points":2,"explanation":"«Как бы хрустальный» — сравнение (показатель — союз «как бы»). «Паутины тонкий волос» — метафора: паутина названа волосом по сходству. «Отдыхающее поле» — олицетворение: полю приписано человеческое состояние.","correctIdx":{"l1":0,"l2":1,"l3":2}},{"id":"q10","part":2,"displayNum":"10","type":"fill-blanks","instruction":"В предложенном стихотворении определите: 1) размер без указания количества стоп; 2) тип рифмовки в первой строфе.","textParts":["1) Размер: ",", 2) Рифмовка: ","."],"correctAnswers":[["ямб","ямбом"],["перекрестная","перекрёстная","перекрестная рифмовка"]],"points":2,"explanation":"Размер — ямб (ударения на чётных слогах, пропуски ударений — пиррихии — размера не меняют). В первой строфе рифмуются 1-я с 3-й и 2-я с 4-й строками (первоначальной — хрустальный, пора — вечера), то есть рифмовка перекрестная (АБАБ)."},{"id":"q11","part":2,"displayNum":"11","type":"single-choice","instruction":"Какая тема определяет идейное содержание стихотворения Ф.И. Тютчева?","options":[{"id":"r1","text":"Любовная лирика: воспоминание о встрече с возлюбленной."},{"id":"r2","text":"Пейзажно-философская лирика: краткий миг гармонии в природе и мысль о течении времени."},{"id":"r3","text":"Гражданская лирика: обличение крепостнических порядков."},{"id":"r4","text":"Тема поэта и поэзии: размышление о назначении художника."}],"correctOption":"r2","points":1,"explanation":"Тютчев изображает «короткую, но дивную пору» ранней осени — переходное состояние природы. За пейзажем стоит философская мысль о быстротечности времени и покое завершённого труда."},{"id":"q12","part":2,"displayNum":"12","type":"multiple-choice","instruction":"Выберите два верных утверждения, характеризующих произведение Ф.И. Тютчева.","options":[{"id":"c1","text":"В стихотворении изображён краткий переходный момент между летом и осенью.","isCorrect":true},{"id":"c2","text":"Образ опустевшего поля связан с мотивом завершённого труда и покоя.","isCorrect":true},{"id":"c3","text":"Лирический герой прямо призывает читателя к борьбе и переменам.","isCorrect":false},{"id":"c4","text":"Стихотворение построено на противопоставлении города и деревни.","isCorrect":false},{"id":"c5","text":"Основное настроение финала — отчаяние перед наступающей зимой.","isCorrect":false}],"points":2,"explanation":"Верны первые два утверждения. Прямых призывов в стихотворении нет, город не упоминается, а финал («льётся чистая и тёплая лазурь») светел: до зимних бурь ещё далеко."},{"id":"q13","part":3,"displayNum":"13","type":"matching","instruction":"Установите соответствие между героями и названиями произведений.","leftCol":[{"id":"l1","text":"А. Евгений Базаров"},{"id":"l2","text":"Б. Родион Раскольников"},{"id":"l3","text":"В. Катерина Кабанова"},{"id":"l4","text":"Г. Илья Обломов"},{"id":"l5","text":"Д. Андрей Болконский"}],"rightCol":["1. «Гроза» (А.Н. Островский)","2. «Обломов» (И.А. Гончаров)","3. «Отцы и дети» (И.С. Тургенев)","4. «Преступление и наказание» (Ф.М. Достоевский)","5. «Война и мир» (Л.Н. Толстой)","6. «Кому на Руси жить хорошо» (Н.А. Некрасов)"],"correctMapping":{"l1":"3. «Отцы и дети» (И.С. Тургенев)","l2":"4. «Преступление и наказание» (Ф.М. Достоевский)","l3":"1. «Гроза» (А.Н. Островский)","l4":"2. «Обломов» (И.А. Гончаров)","l5":"5. «Война и мир» (Л.Н. Толстой)"},"points":2,"explanation":"Базаров — «Отцы и дети», Раскольников — «Преступление и наказание», Катерина — «Гроза», Обломов — «Обломов», Болконский — «Война и мир». Лишнее звено — поэма Н.А. Некрасова.","correctIdx":{"l1":2,"l2":3,"l3":0,"l4":1,"l5":4}},{"id":"q14","part":3,"displayNum":"14","type":"multiple-choice","instruction":"Кто из перечисленных героев умирает в финале произведения? Выберите все верные ответы.","options":[{"id":"c1","text":"Евгений Базаров («Отцы и дети»)","isCorrect":true},{"id":"c2","text":"Катерина Кабанова («Гроза»)","isCorrect":true},{"id":"c3","text":"Аркадий Кирсанов («Отцы и дети»)","isCorrect":false},{"id":"c4","text":"Илья Обломов («Обломов»)","isCorrect":true},{"id":"c5","text":"Анна Одинцова («Отцы и дети»)","isCorrect":false}],"points":2,"explanation":"Базаров умирает от заражения крови, Катерина бросается в Волгу, Обломов умирает на Выборгской стороне. Аркадий и Одинцова в финале живы: оба обзаводятся семьями."},{"id":"q15","part":3,"displayNum":"15","type":"matching","instruction":"По предложенным фрагментам определите названия стихотворений.","leftCol":[{"id":"l1","text":"А. «Умом Россию не понять, / Аршином общим не измерить...»"},{"id":"l2","text":"Б. «Шёпот, робкое дыханье, / Трели соловья...»"},{"id":"l3","text":"В. «Погиб поэт! — невольник чести — / Пал, оклеветанный молвой...»"},{"id":"l4","text":"Г. «Белеет парус одинокой / В тумане моря голубом!..»"}],"rightCol":["1. «Смерть Поэта» (М.Ю. Лермонтов)","2. «Парус» (М.Ю. Лермонтов)","3. «Умом Россию не понять...» (Ф.И. Тютчев)","4. «Шёпот, робкое дыханье...» (А.А. Фет)","5. «Silentium!» (Ф.И. Тютчев)","6. «К Чаадаеву» (А.С. Пушкин)"],"correctMapping":{"l1":"3. «Умом Россию не понять...» (Ф.И. Тютчев)","l2":"4. «Шёпот, робкое дыханье...» (А.А. Фет)","l3":"1. «Смерть Поэта» (М.Ю. Лермонтов)","l4":"2. «Парус» (М.Ю. Лермонтов)"},"points":2,"explanation":"А — «Умом Россию не понять...» Ф.И. Тютчева, Б — «Шёпот, робкое дыханье...» А.А. Фета, В — «Смерть Поэта» М.Ю. Лермонтова, Г — «Парус» М.Ю. Лермонтова.","correctIdx":{"l1":2,"l2":3,"l3":0,"l4":1}},{"id":"q16","part":3,"displayNum":"16","type":"single-choice","instruction":"В каком из предложенных стихотворений звучит мысль о невозможности передать словом внутренний мир человека?","options":[{"id":"r1","text":"«Silentium!» (Ф.И. Тютчев)"},{"id":"r2","text":"«Парус» (М.Ю. Лермонтов)"},{"id":"r3","text":"«Весенняя гроза» (Ф.И. Тютчев)"},{"id":"r4","text":"«Тройка» (Н.А. Некрасов)"}],"correctOption":"r1","points":1,"explanation":"Именно в «Silentium!» звучит формула «Мысль изреченная есть ложь» — мысль о невыразимости внутренней жизни человека и призыв к молчанию."}]}},{"id":"var_auth_2","category":"authored","title":"Авторский вариант №2","subtitle":"(А.П. Чехов «Человек в футляре», А.А. Фет «Учись у них — у дуба, у берёзы…»)","data":{"text1":{"title":"А.П. Чехов. «Человек в футляре» (Фрагмент)","content":"Он был замечателен тем, что всегда, даже в очень хорошую погоду, выходил в калошах и с зонтиком и непременно в тёплом пальто на вате. И зонтик у него был в чехле, и часы в чехле из серой замши, и когда вынимал перочинный нож, чтобы очинить карандаш, то и нож у него был в чехольчике; и лицо, казалось, тоже было в чехле, так как он всё время прятал его в поднятый воротник. Он носил тёмные очки, фуфайку, уши закладывал ватой, и когда садился на извозчика, то приказывал поднимать верх. Одним словом, у этого человека наблюдалось постоянное и непреодолимое стремление окружить себя оболочкой, создать себе, так сказать, футляр, который уединил бы его, защитил бы от внешних влияний.\n\nДействительность раздражала его, пугала, держала в постоянной тревоге, и, быть может, для того, чтобы оправдать эту свою робость, своё отвращение к настоящему, он всегда хвалил прошедшее и то, чего никогда не было...\n\nИ мысль свою Беликов также старался запрятать в футляр. Для него были ясны только циркуляры и газетные статьи, в которых запрещалось что-нибудь. Когда в циркуляре запрещалось ученикам выходить на улицу после девяти часов вечера или в какой-нибудь статье запрещалась плотская любовь, то это было для него ясно, определённо; запрещено — и баста. <...>\n\n— Оно, конечно, так-то так, всё это прекрасно, да как бы чего не вышло."},"text2":{"title":"А.А. Фет. «Учись у них — у дуба, у берёзы…»","content":"Учись у них — у дуба, у берёзы.\nКругом зима. Жестокая пора!\nНапрасные на них застыли слёзы,\nИ треснула, сжимаяся, кора.\n\nВсё злей метель и с каждою минутой\nСердито рвёт последние листы,\nИ за сердце хватает холод лютый;\nОни стоят, молчат; молчи и ты!\n\nНо верь весне. Её промчится гений,\nОпять теплом и жизнию дыша.\nДля ясных дней, для новых откровений\nПереболит скорбящая душа."},"questions":[{"id":"q1","part":1,"displayNum":"1","type":"fill-blanks","instruction":"Заполните пропуски в предложенном тексте. Введите термины в именительном падеже.","textParts":["«Человек в футляре» А.П. Чехова относится к литературному роду ",", а по жанру это "," — небольшое эпическое произведение с одной сюжетной линией и малым числом героев."],"correctAnswers":[["эпос","эпосу"],["рассказ","рассказа"]],"points":2,"explanation":"Перед нами эпическое произведение: события переданы повествователем. Жанр — рассказ: малый объём, одна сюжетная линия, небольшое число действующих лиц. Рассказ входит в «маленькую трилогию» вместе с «Крыжовником» и «О любви»."},{"id":"q2_1","part":1,"displayNum":"2.1","type":"short-text","instruction":"Калоши, зонтик в чехле, часы в замшевом чехле, нож в чехольчике — эти повторяющиеся значимые подробности помогают понять характер героя. Такая подробность называется...","correct":["художественная деталь","деталь","художественной деталью","деталью"],"points":1,"explanation":"Художественная деталь — выразительная подробность, которая несёт большую смысловую нагрузку. У Чехова деталь заменяет развёрнутую характеристику: вещи в чехлах говорят о характере Беликова больше, чем прямая авторская оценка."},{"id":"q2_2","part":1,"displayNum":"2.2","type":"short-text","instruction":"Описывая героя, автор доводит подробность до предела: «и лицо, казалось, тоже было в чехле». Чрезмерное художественное преувеличение свойств изображаемого называется...","correct":["гипербола","гиперболой"],"points":1,"explanation":"Гипербола — чрезмерное преувеличение. Оно создаёт комический и одновременно пугающий эффект: футляром оказывается уже не вещь, а сам человек."},{"id":"q2_3","part":1,"displayNum":"2.3","type":"single-choice","instruction":"Выберите верное утверждение, характеризующее предложенный фрагмент произведения А.П. Чехова.","options":[{"id":"r1","text":"Беликов надевает калоши и берёт зонт только в дурную погоду."},{"id":"r2","text":"Стремление героя спрятаться от жизни объясняется в тексте страхом перед действительностью."},{"id":"r3","text":"Повествователь открыто восхищается образом жизни Беликова и советует ему следовать."},{"id":"r4","text":"Для Беликова ясно прежде всего то, что циркулярами разрешено."}],"correctOption":"r2","points":1,"explanation":"В тексте прямо сказано: «Действительность раздражала его, пугала, держала в постоянной тревоге». Калоши и зонт герой носит «даже в очень хорошую погоду», а ясно ему только то, что запрещено: «запрещено — и баста»."},{"id":"q3","part":1,"displayNum":"3","type":"sequence","instruction":"Установите хронологическую последовательность событий рассказа. Впишите последовательность цифр без пробелов.","items":[{"id":"1","text":"Коваленко спускает Беликова с лестницы, и Варенька видит это"},{"id":"2","text":"Похороны Беликова"},{"id":"3","text":"В городе появляются новый учитель Коваленко и его сестра Варенька"},{"id":"4","text":"Сослуживцы решают женить Беликова на Вареньке"}],"correctAnswer":"3412","points":1,"explanation":"Приезд Коваленко и Вареньки (3) даёт повод к сватовству (4). Ссора из-за велосипеда и карикатуры заканчивается падением с лестницы на глазах у Вареньки (1), после чего Беликов заболевает и умирает (2). Верный порядок: 3412."},{"id":"q4","part":1,"displayNum":"4","type":"matching","instruction":"Установите соответствие между героями рассказа и их характеристиками.","leftCol":[{"id":"l1","text":"А. Беликов"},{"id":"l2","text":"Б. Михаил Коваленко"},{"id":"l3","text":"В. Варенька"}],"rightCol":["1. Учитель греческого языка, который даже в хорошую погоду выходит в калошах и с зонтиком","2. Молодой учитель истории и географии, прямой и резкий, не выносящий доносчиков","3. Смешливая хохлушка, поющая малороссийские романсы и катающаяся на велосипеде","4. Жена старосты, которая последние десять лет не выходит за пределы села"],"correctMapping":{"l1":"1. Учитель греческого языка, который даже в хорошую погоду выходит в калошах и с зонтиком","l2":"2. Молодой учитель истории и географии, прямой и резкий, не выносящий доносчиков","l3":"3. Смешливая хохлушка, поющая малороссийские романсы и катающаяся на велосипеде"},"points":2,"explanation":"Беликов — учитель греческого в калошах и с зонтом; Коваленко — молодой учитель истории и географии, прямой и резкий; Варенька — весёлая сестра Коваленко. Четвёртая характеристика относится к Мавре, жене старосты, из обрамляющего рассказа.","correctIdx":{"l1":0,"l2":1,"l3":2}},{"id":"q5","part":1,"displayNum":"5","type":"matching","instruction":"Установите соответствие между героями рассказа и принадлежащими им репликами или поступками.","leftCol":[{"id":"l1","text":"А. Беликов"},{"id":"l2","text":"Б. Михаил Коваленко"},{"id":"l3","text":"В. Варенька"}],"rightCol":["1. «Оно, конечно, так-то так, всё это прекрасно, да как бы чего не вышло».","2. «Я не люблю фискалов».","3. Раскатистое, заливчатое «ха-ха-ха», которым «завершилось всё».","4. Рассказывает историю героя ночью, лёжа на сеновале в сарае старосты."],"correctMapping":{"l1":"1. «Оно, конечно, так-то так, всё это прекрасно, да как бы чего не вышло».","l2":"2. «Я не люблю фискалов».","l3":"3. Раскатистое, заливчатое «ха-ха-ха», которым «завершилось всё»."},"points":2,"explanation":"«Как бы чего не вышло» — присказка Беликова. «Я не люблю фискалов» — реплика Коваленко. Смех Вареньки решает судьбу героя. Четвёртый пункт относится к Буркину — рассказчику обрамляющей истории.","correctIdx":{"l1":0,"l2":1,"l3":2}},{"id":"q6","part":1,"displayNum":"6","type":"multiple-choice","instruction":"Выберите все верные утверждения, характеризующие произведение А.П. Чехова.","options":[{"id":"c1","text":"Рассказ входит в «маленькую трилогию» вместе с «Крыжовником» и «О любви».","isCorrect":true},{"id":"c2","text":"История Беликова передана как рассказ в рассказе: её ведёт учитель Буркин.","isCorrect":true},{"id":"c3","text":"Беликов женится на Вареньке и меняет свой образ жизни.","isCorrect":false},{"id":"c4","text":"Смерть героя не освобождает город: «футлярных» людей, по мысли рассказчика, осталось немало.","isCorrect":true},{"id":"c5","text":"Действие рассказа происходит в Петербурге в годы правления Николая I.","isCorrect":false}],"points":2,"explanation":"Верны первое, второе и четвёртое утверждения. Сватовство расстраивается, и герой умирает; действие происходит в провинциальном городе конца XIX века."},{"id":"q8","part":2,"displayNum":"8","type":"short-text","instruction":"Выпишите из текста (А.А. Фет. «Учись у них — у дуба, у берёзы…») устаревшую форму слова «жизнью» в том виде, в каком она употреблена в стихотворении.","correct":["жизнию"],"points":1,"explanation":"«Опять теплом и жизнию дыша» — «жизнию» — устаревшая форма творительного падежа, характерная для высокого поэтического стиля XIX века."},{"id":"q9","part":2,"displayNum":"9","type":"matching","instruction":"Установите соответствие между выделенными примерами из текста и названиями художественных средств.","leftCol":[{"id":"l1","text":"А. «Кругом зима. Жестокая пора!»"},{"id":"l2","text":"Б. «Всё злей метель… Сердито рвёт последние листы»"},{"id":"l3","text":"В. «Её промчится гений» (о весне)"}],"rightCol":["1. метафора","2. олицетворение","3. эпитет","4. гипербола"],"correctMapping":{"l1":"3. эпитет","l2":"2. олицетворение","l3":"1. метафора"},"points":2,"explanation":"«Жестокая пора» — эпитет: образное определение. Метель, которая «злей» и «сердито рвёт», — олицетворение: природе приписаны человеческие чувства. «Гений весны» — метафора: весна названа духом-покровителем.","correctIdx":{"l1":2,"l2":1,"l3":0}},{"id":"q10","part":2,"displayNum":"10","type":"fill-blanks","instruction":"В предложенном стихотворении определите: 1) размер без указания количества стоп; 2) тип рифмовки.","textParts":["1) Размер: ",", 2) Рифмовка: ","."],"correctAnswers":[["ямб","ямбом"],["перекрестная","перекрёстная","перекрестная рифмовка"]],"points":2,"explanation":"Размер — ямб. Рифмуются 1-я строка с 3-й и 2-я с 4-й (берёзы — слёзы, пора — кора), то есть рифмовка перекрестная (АБАБ); она выдержана во всех трёх строфах."},{"id":"q11","part":2,"displayNum":"11","type":"single-choice","instruction":"Какая тема определяет идейное содержание стихотворения А.А. Фета?","options":[{"id":"r1","text":"Философская лирика: мысль о стойкости и вере в неизбежное обновление."},{"id":"r2","text":"Любовная лирика: воспоминание о ночной встрече."},{"id":"r3","text":"Гражданская лирика: призыв к переустройству общества."},{"id":"r4","text":"Тема поэта и поэзии: спор о назначении искусства."}],"correctOption":"r1","points":1,"explanation":"Зимний пейзаж служит философскому обобщению: человеку предложено учиться у деревьев молчаливой стойкости, потому что за зимой неизбежно приходит весна («Но верь весне»)."},{"id":"q12","part":2,"displayNum":"12","type":"multiple-choice","instruction":"Выберите два верных утверждения, характеризующих произведение А.А. Фета.","options":[{"id":"c1","text":"Образы дуба и берёзы становятся примером стойкости, которому призван учиться человек.","isCorrect":true},{"id":"c2","text":"Стихотворение построено на параллели между жизнью природы и жизнью человека.","isCorrect":true},{"id":"c3","text":"Зима изображена как пора покоя и безмятежной радости.","isCorrect":false},{"id":"c4","text":"Финал лишает читателя надежды на перемены.","isCorrect":false},{"id":"c5","text":"Стихотворение написано в форме диалога двух героев.","isCorrect":false}],"points":2,"explanation":"Верны первые два утверждения. Зима названа «жестокой порой», финал светел («Но верь весне»), а стихотворение представляет собой монологическое обращение лирического героя."},{"id":"q13","part":3,"displayNum":"13","type":"matching","instruction":"Установите соответствие между героями и названиями произведений.","leftCol":[{"id":"l1","text":"А. Беликов"},{"id":"l2","text":"Б. Павел Петрович Кирсанов"},{"id":"l3","text":"В. Марфа Игнатьевна Кабанова"},{"id":"l4","text":"Г. Наташа Ростова"},{"id":"l5","text":"Д. Соня Мармеладова"}],"rightCol":["1. «Гроза» (А.Н. Островский)","2. «Отцы и дети» (И.С. Тургенев)","3. «Человек в футляре» (А.П. Чехов)","4. «Война и мир» (Л.Н. Толстой)","5. «Преступление и наказание» (Ф.М. Достоевский)","6. «Обломов» (И.А. Гончаров)"],"correctMapping":{"l1":"3. «Человек в футляре» (А.П. Чехов)","l2":"2. «Отцы и дети» (И.С. Тургенев)","l3":"1. «Гроза» (А.Н. Островский)","l4":"4. «Война и мир» (Л.Н. Толстой)","l5":"5. «Преступление и наказание» (Ф.М. Достоевский)"},"points":2,"explanation":"Беликов — «Человек в футляре», Павел Петрович — «Отцы и дети», Кабаниха — «Гроза», Наташа Ростова — «Война и мир», Соня Мармеладова — «Преступление и наказание». Лишний пункт — роман И.А. Гончарова.","correctIdx":{"l1":2,"l2":1,"l3":0,"l4":3,"l5":4}},{"id":"q14","part":3,"displayNum":"14","type":"multiple-choice","instruction":"Выберите все верные утверждения о творчестве А.П. Чехова.","options":[{"id":"c1","text":"Чехов — мастер малой прозы: в его рассказах особую роль играет художественная деталь.","isCorrect":true},{"id":"c2","text":"«Маленькая трилогия» состоит из рассказов «Человек в футляре», «Крыжовник» и «О любви».","isCorrect":true},{"id":"c3","text":"Перу Чехова принадлежит роман «Обломов».","isCorrect":false},{"id":"c4","text":"Чехов — автор пьесы «Вишнёвый сад».","isCorrect":true},{"id":"c5","text":"Чехов был современником и другом А.С. Пушкина.","isCorrect":false}],"points":2,"explanation":"Верны первое, второе и четвёртое утверждения. «Обломов» написал И.А. Гончаров; Пушкин погиб в 1837 году, за двадцать три года до рождения Чехова."},{"id":"q15","part":3,"displayNum":"15","type":"matching","instruction":"По предложенным фрагментам определите названия стихотворений.","leftCol":[{"id":"l1","text":"А. «Люблю грозу в начале мая, / Когда весенний, первый гром...»"},{"id":"l2","text":"Б. «Сияла ночь. Луной был полон сад. Лежали / Лучи у наших ног...»"},{"id":"l3","text":"В. «Поэтом можешь ты не быть, / Но гражданином быть обязан»"},{"id":"l4","text":"Г. «Прощай, свободная стихия! / В последний раз передо мной...»"}],"rightCol":["1. «Весенняя гроза» (Ф.И. Тютчев)","2. «Пророк» (А.С. Пушкин)","3. «Сияла ночь. Луной был полон сад...» (А.А. Фет)","4. «Поэт и гражданин» (Н.А. Некрасов)","5. «К морю» (А.С. Пушкин)","6. «Несжатая полоса» (Н.А. Некрасов)"],"correctMapping":{"l1":"1. «Весенняя гроза» (Ф.И. Тютчев)","l2":"3. «Сияла ночь. Луной был полон сад...» (А.А. Фет)","l3":"4. «Поэт и гражданин» (Н.А. Некрасов)","l4":"5. «К морю» (А.С. Пушкин)"},"points":2,"explanation":"А — «Весенняя гроза» Ф.И. Тютчева, Б — «Сияла ночь...» А.А. Фета, В — «Поэт и гражданин» Н.А. Некрасова, Г — «К морю» А.С. Пушкина.","correctIdx":{"l1":0,"l2":2,"l3":3,"l4":4}},{"id":"q16","part":3,"displayNum":"16","type":"single-choice","instruction":"В каком из предложенных стихотворений прямо утверждается мысль о гражданском долге поэта?","options":[{"id":"r1","text":"«Поэт и гражданин» (Н.А. Некрасов)"},{"id":"r2","text":"«Шёпот, робкое дыханье...» (А.А. Фет)"},{"id":"r3","text":"«Есть в осени первоначальной...» (Ф.И. Тютчев)"},{"id":"r4","text":"«К морю» (А.С. Пушкин)"}],"correctOption":"r1","points":1,"explanation":"Формула «Поэтом можешь ты не быть, / Но гражданином быть обязан» из стихотворения Н.А. Некрасова «Поэт и гражданин» стала выражением идеи гражданского служения искусства."}]}}]};

/* ---------- профиль умений: часть работы и тип задания ---------- */
function getSkill(q) {
  var t = q.type, ins = (q.instruction || '').toLowerCase();
  if (q.part === 1) {
    if (t === 'fill-blanks') return 'theory';
    if (t === 'short-text') return 'details';
    if (t === 'sequence' || t === 'matching') return 'plot';
    return 'prose';
  }
  if (q.part === 2) {
    if (t === 'fill-blanks') return 'theory';
    if (t === 'short-text' || t === 'matching') return 'details';
    return 'poetry';
  }
  return /стихотворен/.test(ins) ? 'poetry' : 'plot';
}
var SKILLS = [

function getHint(q) {

  if (t === 'fill-blanks') {
    if (/размер/.test(ins)) h.push('Размер: расставьте ударения в первой строке и найдите повторяющуюся стопу — двусложную (ямб, хорей) или трёхсложную (дактиль, амфибрахий, анапест).');
    if (/рифм/.test(ins)) h.push('Рифмовка: обозначьте рифмующиеся окончания строк буквами. АБАБ — перекрёстная, ААББ — смежная, АББА — опоясывающая.');
    if (/при[её]м/.test(ins)) h.push('Приём: посмотрите, что повторяется в начале соседних строк.');
    if (!h.length) h.push('Нужны термины теории литературы: род, жанр, направление или элемент композиции и сюжета. Вводите их в именительном падеже.');
    return h.join(' ');
  }
  if (t === 'short-text') {
    if (/выпишите/.test(ins)) return 'Найдите слово в тексте стихотворения и выпишите его в той форме, в какой оно стоит в строке.';
    return 'Ответ — литературоведческий термин. Определите, что описано в задании: подробность, троп, стилистическая фигура или форма речи персонажа.';
  }
  if (t === 'true-false') return 'Сверяйте каждое утверждение с текстом фрагмента: верным считается только то, что прямо подтверждается текстом.';
  if (t === 'sequence') return 'Вспомните сюжет целиком: с какого события начинается произведение, где кульминация и чем оно заканчивается.';
  if (t === 'matching') {
    if (/при[её]м|средств/.test(ins)) return 'Определите природу каждого примера: «как», «словно» — сравнение; повтор в начале строк — анафора; свойства живого у неживого — олицетворение; образное определение — эпитет.';
    if (/стихотворен/.test(ins)) return 'Вспомните первые строки стихотворений и их авторов. В правом столбце есть лишние названия.';
    if (/произведени/.test(ins)) return 'Вспомните, в каком произведении действует каждый герой. В правом столбце есть лишние названия.';
    return 'Соотнесите цитату или факт с характером и судьбой героя. В правом столбце есть лишний вариант.';
  }
  if (t === 'multiple-choice') return (/два/.test(ins) ? 'Нужно выбрать ровно два ответа. ' : '') + 'Проверяйте каждое утверждение отдельно: неверные искажают факт сюжета или приписывают герою чужой поступок.';
  if (t === 'single-choice') {
    if (/тема/.test(ins)) return 'Определите, о чём стихотворение в целом, а не в одной строфе: тема должна охватывать весь текст.';
    if (/стихотворени/.test(ins)) return 'Вспомните содержание каждого стихотворения из списка и найдите то, где мотив из вопроса главный.';

var TYPE_LABEL = {

  'multiple-choice': 'Несколько ответов', 'matching': 'Соответствие', 'sequence': 'Последовательность',
  'true-false': 'Верно / неверно'
};

/* ================================================================
   ПРОВЕРКА ОТВЕТОВ
   Полный балл — за безошибочный ответ. Для заданий на 2 балла
   одна ошибка стоит 1 балл (соответствие, множественный выбор,
   верно/неверно, пропуски); последовательность — только целиком.
   ================================================================ */
function checkQuestion(q, ans) {
  var max = q.points, earned = 0, mine = '', right = '', i, ok, err;

  if (q.type === 'short-text') {
    var val = (ans || '').trim();
    mine = val; right = q.correct[0];
    if (val && q.correct.some(function (a) { return norm(a) === norm(val); })) earned = max;

  } else if (q.type === 'fill-blanks') {
    var arr = ans || [], n = q.correctAnswers.length; ok = 0;
    var mineParts = [], rightParts = [];
    for (i = 0; i < n; i++) {
      var v = (arr[i] || '').trim();
      var hit = v && q.correctAnswers[i].some(function (a) { return norm(a) === norm(v); });
      if (hit) ok++;
      mineParts.push((i + 1) + ') ' + (v || '—'));
      rightParts.push((i + 1) + ') ' + q.correctAnswers[i][0]);
    }
    earned = Math.round(max * ok / n);
    mine = mineParts.join('   '); right = rightParts.join('   ');

  } else if (q.type === 'single-choice') {
    var pick = q.options.filter(function (o) { return o.id === ans; })[0];
    var cor = q.options.filter(function (o) { return o.id === q.correctOption; })[0];
    mine = pick ? optLabel(q, pick) : ''; right = cor ? optLabel(q, cor) : '';
    if (ans === q.correctOption) earned = max;

  } else if (q.type === 'multiple-choice') {
    var sel = ans || {}, miss = 0, extra = 0, mineArr = [], rightArr = [];
    q.options.forEach(function (o) {
      var chosen = !!sel[o.id];
      if (chosen) mineArr.push(optLabel(q, o));
      if (o.isCorrect) rightArr.push(optLabel(q, o));
      if (o.isCorrect && !chosen) miss++;
      if (!o.isCorrect && chosen) extra++;
    });
    err = miss + extra;
    earned = err === 0 ? max : (max === 2 && err === 1 ? 1 : 0);
    mine = mineArr.join('\n'); right = rightArr.join('\n');

  } else if (q.type === 'true-false') {
    var a = ans || {}; ok = 0;
    var m2 = [], r2 = [];
    q.items.forEach(function (it, idx) {
      if (a[it.id] === it.correct) ok++;
      m2.push((idx + 1) + ') ' + (a[it.id] || '—'));
      r2.push((idx + 1) + ') ' + it.correct);
    });
    err = q.items.length - ok;
    earned = err === 0 ? max : (max === 2 && err === 1 ? 1 : 0);
    mine = m2.join('   '); right = r2.join('   ');

  } else if (q.type === 'matching') {
    var am = ans || {}; ok = 0;
    var m3 = [], r3 = [];
    q.leftCol.forEach(function (l) {
      var got = am[l.id];
      var want = q.correctIdx[l.id];
      if (got !== undefined && got !== '' && Number(got) === Number(want)) ok++;
      var key = l.text.split('.')[0];
      m3.push(key + ' → ' + (got === undefined || got === '' ? '—' : cut(q.rightCol[Number(got)], 60)));
      r3.push(key + ' → ' + cut(q.rightCol[Number(want)], 60));
    });
    err = q.leftCol.length - ok;
    earned = err === 0 ? max : (max === 2 && err === 1 ? 1 : 0);
    mine = m3.join('\n'); right = r3.join('\n');

  } else if (q.type === 'sequence') {
    var s = (ans || '').trim();
    mine = s; right = q.correctAnswer;
    if (s === q.correctAnswer) earned = max;
  }

  if (!mine) mine = '— нет ответа —';
  return { earned: earned, max: max, mine: mine, right: right, full: earned === max, zero: earned === 0 };
}
function optLabel(q, o) {
  var i = q.options.indexOf(o);
  return (i + 1) + ') ' + o.text.replace(/\*\*/g, '');
}

/* ---------- сводный подсчёт ---------- */
function grade(variant, answers, timeSpent) {
  var total = 0, max = 0, items = [];
  var skills = {}; SKILLS.forEach(function (s) { skills[s[0]] = { e: 0, m: 0 }; });
  variant.data.questions.forEach(function (q) {
    var r = checkQuestion(q, answers[q.id]);
    total += r.earned; max += r.max;
    var sk = getSkill(q);
    skills[sk].e += r.earned; skills[sk].m += r.max;
    items.push({ q: q, r: r });
  });
  var pct = max ? Math.round(total / max * 100) : 0;
  return {
    variantId: variant.id, title: variant.title, total: total, max: max, pct: pct,
    items: items, skills: skills, timeSpent: timeSpent, date: Date.now()
  };
}
function levelOf(pct) {
  if (pct >= 75) return 'Высокий уровень';
  if (pct >= 50) return 'Средний уровень';
  if (pct >= 30) return 'Уровень ниже среднего';
  return 'Низкий уровень';
}

function answered(q) {

}
function refreshNav(qid) {
  var qs = S.variant.data.questions, done = 0;

    var ok = answered(q); if (ok) done++;

}

function qHtml(q) {
  var used = S.usedHints[q.id];
  var out = '<article class="panel q" id="q-' + esc(q.id) + '"><div class="q-head"><span class="q-num">' + esc(q.displayNum) + '</span>' +

  if (used) out += hintBox(used);
  else if (S.hintsLeft > 0) out += '<div class="q-foot no-print"><button class="hint-btn" data-act="hint" data-id="' + esc(q.id) + '">' + icon('bulb') + 'Подсказка</button></div>';
  return out + '</article>';
}
function hintBox(t) { return '<div class="hint">' + icon('bulb') + '<div><b>Подсказка</b>' + esc(t) + '</div></div>'; }

function qBody(q) {
  var a = S.answers[q.id], out = '';
  switch (q.type) {
    case 'fill-blanks': {
      var arr = a || [];
      out = '<div class="cloze">';
      q.textParts.forEach(function (part, i) {
        out += esc(part);
        if (i < q.textParts.length - 1) out += '<input class="blank" type="text" autocomplete="off" data-a="fb" data-q="' + esc(q.id) + '" data-i="' + i + '" value="' + esc(arr[i] || '') + '" aria-label="Пропуск ' + (i + 1) + '">';
      });
      return out + '</div>';
    }
    case 'short-text':
      return '<input class="field" type="text" autocomplete="off" placeholder="Ответ" data-a="st" data-q="' + esc(q.id) + '" value="' + esc(a || '') + '">';
    case 'single-choice':
      return '<div class="opts">' + q.options.map(function (o) {
        return '<label class="opt"><input type="radio" name="' + esc(q.id) + '" data-a="sc" data-q="' + esc(q.id) + '" value="' + esc(o.id) + '"' + (a === o.id ? ' checked' : '') + '><span>' + fmt(o.text) + '</span></label>';
      }).join('') + '</div>';
    case 'multiple-choice':
      return '<div class="opts">' + q.options.map(function (o) {
        return '<label class="opt"><input type="checkbox" data-a="mc" data-q="' + esc(q.id) + '" data-opt="' + esc(o.id) + '"' + (a && a[o.id] ? ' checked' : '') + '><span>' + fmt(o.text) + '</span></label>';
      }).join('') + '</div>';
    case 'true-false':
      return '<div class="tf">' + q.items.map(function (it) {
        var cur = a && a[it.id];
        return '<div class="tf-row"><span>' + fmt(it.text) + '</span><div class="toggle" role="group">' + ['Верно', 'Неверно'].map(function (val) {
          return '<button type="button" data-a="tf" data-q="' + esc(q.id) + '" data-item="' + esc(it.id) + '" data-val="' + val + '" aria-pressed="' + (cur === val) + '">' + val + '</button>';
        }).join('') + '</div></div>';
      }).join('') + '</div>';
    case 'sequence': {
      var order = validPerm(a, q.items.length) ? a.split('').map(Number) : q.items.map(function (_, i) { return i + 1; });
      out = '<ol class="seq-list" data-seq="' + esc(q.id) + '">' + order.map(function (n) {
        return '<li class="seq-item" draggable="true" data-n="' + n + '">' + icon('grip', 'grip') + '<span class="n">' + n + '</span><span class="t">' + fmt(q.items[n - 1].text) + '</span>' +
          '<span class="seq-move"><button type="button" data-act="seq-move" data-q="' + esc(q.id) + '" data-n="' + n + '" data-dir="-1" aria-label="Выше">' + icon('up') + '</button>' +
          '<button type="button" data-act="seq-move" data-q="' + esc(q.id) + '" data-n="' + n + '" data-dir="1" aria-label="Ниже">' + icon('down') + '</button></span></li>';
      }).join('') + '</ol>';
      return out + '<div class="seq-answer"><input class="field" inputmode="numeric" maxlength="' + q.items.length + '" placeholder="' + '·'.repeat(q.items.length) + '" data-a="seq" data-q="' + esc(q.id) + '" value="' + esc(a || '') + '" aria-label="Ответ цифрами">' +
        '<span>Расставьте события по порядку перетаскиванием или стрелками — ответ запишется цифрами. Можно ввести цифры вручную.</span></div>';
    }
    case 'matching':
      out = '<div class="match">' + q.leftCol.map(function (l) {
        var cur = a && a[l.id] !== undefined ? String(a[l.id]) : '';
        return '<div class="match-row"><div class="left">' + fmt(l.text) + '</div><select class="field" data-a="mt" data-q="' + esc(q.id) + '" data-left="' + esc(l.id) + '" aria-label="Соответствие: ' + esc(l.text) + '">' +
          '<option value=""' + (cur === '' ? ' selected' : '') + '>Выберите вариант</option>' +
          q.rightCol.map(function (r, i) { return '<option value="' + i + '"' + (cur === String(i) ? ' selected' : '') + '>' + esc(cut(r, 72)) + '</option>'; }).join('') + '</select></div>';
      }).join('') + '</div>';
      return out + '<div class="ref"><h4>Варианты для соответствия</h4><ol>' + q.rightCol.map(function (r) { return '<li>' + fmt(r) + '</li>'; }).join('') + '</ol></div>';
  }
  return '';
}
function validPerm(s, n) {
  if (typeof s !== 'string' || s.length !== n) return false;
  var seen = {};
  for (var i = 0; i < n; i++) { var d = +s[i]; if (!(d >= 1 && d <= n) || seen[d]) return false; seen[d] = 1; }
  return true;
}

/* ---------------- результаты ---------------- */

      '<span class="bar"><i style="width:' + (p || 0) + '%;background:' + (p === null ? 'transparent' : p >= 75 ? 'var(--ok)' : p >= 50 ? 'var(--accent)' : 'var(--bad)') + '"></i></span>' +

  out += '<div class="panel rmap"><h2>Задания</h2><div class="rmap-grid">' + R.items.map(function (it) {

  }).join('') + '</div><div class="legend"><span><i style="background:var(--ok)"></i>полный балл</span><span><i style="background:var(--amber)"></i>часть баллов</span><span><i style="background:var(--bad)"></i>без баллов</span></div></div>';

  out += '<div class="review-bar"><h2>Разбор</h2><div class="tools no-print"><div class="seg">' +
    '<button class="seg-btn" data-act="filter" data-f="errors" aria-selected="' + (S.filter === 'errors') + '">Ошибки · ' + (part + zero) + '</button>' +

    '<button class="btn secondary" data-act="print">' + icon('print') + 'Печать</button></div></div>';

  out += '<div class="review">';

      '<div class="cmp' + (it.r.full ? ' single' : '') + '"><div class="mine ' + c + '"><span class="lbl">Ваш ответ</span>' + esc(it.r.mine) + '</div>' +
      (it.r.full ? '' : '<div class="right"><span class="lbl">Верный ответ</span>' + esc(it.r.right) + '</div>') + '</div>' +
      (it.q.explanation ? '<details class="expl"' + (it.r.full ? '' : ' open') + '><summary>Объяснение ' + icon('down') + '</summary><div class="expl-body">' + fmt(it.q.explanation) + '</div></details>' : '') +
